summary = 'Theodorus was a Christian biblical scholar of the mid-4th century AD. He was bishop of Heraclea in Thrace, being appointed some time between 328 and 334; he was an ally of Eusebius against the Athanasians. He should not be confused with Theodore Stratelates (281–319), sometimes called "Theodore of Heraclea"; Theodore Stratelates lived in Heraclea Pontica.'
