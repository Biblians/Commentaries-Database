[[commentary]]
quote='''
"In many portions and in many ways God spoke to the fathers in the prophets". Sometimes indeed he teaches us ineffable mysteries in the things he speaks; but sometimes he instructs us concerning the Savior and his coming; and at other times he corrects and amends our conduct. On this account we shall attempt to assign, throughout the several passages of divine Scripture, distinctions of this kind, and to discern where there are prophecies and something is said about things to come, where certain mystical things are indicated, and where the passage is moral. Beginning therefore the exposition of the thirty-sixth psalm, we find that this whole psalm is moral, and given as it were as a certain care and medicine for the human soul, since it reproves our sins and teaches us to live according to the law. But let us now see what sort of beginning the first verse gives us. "Be not", he says, "jealous among the malignant, neither be envious of those who work iniquity: for like grass they shall quickly wither, and like the green herbs they shall quickly fall away". There are indeed two things which he teaches us in these words that we ought not to do. First, that we should not be jealous among the malignant; second, that we should not envy those who work iniquity — because the consequence for the one who is jealous among the malignant is that he withers like grass, and this he will suffer not slowly but quickly; while the consequence for the one who envies those who work iniquity is that he falls away quickly like the green herbs. And according to the simple understanding of the letter, "not to be jealous among the malignant" seems to indicate this: that among evil and utterly wicked men one should not become a zealot of malice, that is, a leader and author of it, offering as it were to the rest a pattern of disgrace. But "to envy those who work iniquity" is this: if one imitates them, and learns to act unjustly. And this is what is said in both cases: that you neither offer to others an example of malice, nor yourself follow the examples of other evil men. But that we may more fully recognize what this saying contains within it as well, I think it fitting to bring in from the divine Scriptures, wherever we find this saying written, and to compare spiritual things with spiritual, so that what is indicated through these may appear more evidently. It is written in Deuteronomy: "They provoked me to zeal in what is not God, they roused me to anger in their idols, and I will bring them to zeal in what is not a nation". Here, where in Latin it is said, "they brought me to zeal, and I will bring them to zeal", in the Greek it is the very same word that was spoken at the beginning of the psalm, that is, "they were jealous of me, and I will be jealous of them". Although that Greek word itself, that is, παρεζήλωσαν, would seem to be more significantly expressed in Latin if we should say "they provoked me", yet it is the very same word. But in the Apostle also it is written: "Do we provoke the Lord to jealousy? Are we stronger than he?" And where we have "we provoke the Lord to jealousy", in certain copies it is written "we provoke the Lord". From all these testimonies it is indicated that to be jealous of someone is to provoke and to rouse him: so that, for example's sake, if we use such an illustration: there are certain shameless and worthless women who, if perchance they have caught men in the enticements of a stolen love, in the course of time, not content with hidden disgraces, wish also to make it known to the chaste wives that they are loved by their husbands, in order that by this they may stir up jealousy, and provoke, and disturb other households. If you have understood the force of the example — how a mistress rouses jealousy in a wife — this too you ought to observe: what it is to be jealous among certain people, that is, when incitements to some malice are offered them. Finally, since that saying of Deuteronomy, in which he says, "They brought me to zeal in what is not God", that is, παρεζήλωσαν, means this, it becomes more clearly manifest from this what is written elsewhere, that our God is called a jealous God. Now a husband is wont to be called jealous concerning his wife, when he cares for her chastity more anxiously and cautiously, and does not allow the chastity of his spouse to be defiled. Whence it follows that he who sins provokes and rouses to jealousy God, who is called jealous. But all these things are to be heard of God abusively, just as also those things which are said of the wrath of God, or of sleep, or of sorrow, through which is understood what each one of us deserves from God for his own deeds. Finally, thus he said in Deuteronomy, that "they brought me to zeal in what is not God, and exasperated me in their idols", that is, by worshiping idols they roused me to zeal. But what follows? "And I will bring them to zeal in what is not a nation, in a foolish nation I will provoke them". Whence even now the Jews are not stirred against the gentiles, against those who worship idols and blaspheme God, and they do not hate them, nor are they indignant against them; but against Christians they are borne with an insatiable hatred — Christians who indeed, having left idols behind, are converted to God. When therefore you see the Jews holding a Christian in hatred and lying in wait for him, understand that that prophecy is fulfilled which says: "And I will rouse them by what is not a nation". For we are "not a nation," we who believe a few from this city, and others from another, and nowhere does a whole nation appear to have been taken up from the beginning of belief. For it is not as the nation of the Jews was, or the nation of the Egyptians, that in like manner also the race of the Christians is one nation, or a whole one, but they are gathered scatteredly out of the several nations. He says therefore, that "I will bring them to zeal by what is not a nation, in a foolish nation I will provoke them". And therefore they are provoked against us, and hold us in hatred as a foolish nation, saying that they themselves are wise, since indeed to them first the oracles of God were entrusted, and, meditating on the law of God from boyhood even to old age, they did not attain to the law of God; but for this reason God chose the foolish things of this world, that he might confound the wise, and thus is fulfilled what is written: "In a foolish nation I will provoke them". But let us see also what the Apostle indicates when he says: "Do we provoke the Lord to jealousy? Are we stronger than he?" In that passage he said these things where he disputes about sacrifices and about the things offered to idols. "Do we provoke the Lord to jealousy", he says, that is, do we rouse him to zeal by eating the things offered to idols, just as the Jews stirred his zeal in their idols? Do we too wish to act in a like manner? Therefore he says: "Do we provoke the Lord to jealousy? Are we stronger than he?" This is what he means. If indeed we rouse to jealousy someone who is inferior to us in strength, we can easily despise him; but if we rouse a strong one to jealousy, are we not contriving these things unto our own ruin? If therefore we feed on things offered to idols, and rouse the Lord's zeal against us, we provoke a stronger wrath against us, that is, unto our own destruction. Whenever therefore you see a worthless man, watch, and beware lest you rouse his jealousy against you, lest you do anything incautiously whereby wickedness may be roused. For example's sake, that what is said may become plainer through an illustration: the blessed David roused the malignant Saul to jealousy, when he went out before the army and slew Goliath, and there came forth choirs of girls and women saying: "Saul has struck down in his thousands, and David in his ten thousands". And this indeed, if David had done it by his own effort, he would have been jealous in the malignity of Saul. But now it was not by his own effort that it came about that the choirs of girls went out and sang a hymn of this kind, that David had struck down in ten thousands, and Saul in thousands. This therefore is what the psalm teaches us: that since the race of men is prone to jealousy, and is very easily inclined to this vice, you should observe not to do that which would provoke evil men to jealousy of you, and rouse them to lie in wait for you, or stir them up to hatred of you. And this is the whole of what is signified in all these things: that you neither yourself provoke the jealousy of the evil against you, nor envy the wickedness of another. How then does a man envy the wickedness of another? Without doubt when he does the same things. But what I say is this: If someone has been made rich from poor through iniquity, and there is a needy neighbor of his, and he sees him who rose up from the earth and ascended to the height of riches, and begins to envy so that he too may likewise grow rich from iniquity, this is to envy those who work iniquity. But also if anyone should wish to envy him who, whether by stealthy debaucheries or by unlawful ventures, seizes upon marriages, houses, riches beyond his own place and measure, he has envied those who work iniquity. And further, those who through diverse disgraces, or through unworthy and unlawful ambitions, have reached the undeserved heights of goods, and by iniquitous factions or bloody hands have seized honors not due to them — if anyone, seeing these, is inflamed to a like madness, he has envied those who work iniquity.
'''
