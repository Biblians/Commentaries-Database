[[commentary]]
quote='''
"The Lord knows the days of the spotless, and their inheritance shall be forever". According to the Scriptures, as we have observed in many places, the Lord does not know all things, but only those that are good; but he is said to be ignorant of evils, not that there is truly anything that lies hidden from his knowledge, but those things which are unworthy of his notice, he is said to be ignorant of. Which we have also shown from the Scriptures, when the Apostle says: "If anyone among you be a prophet, or spiritual, let him know the things that I write to you, that they are the Lord's". But if anyone is ignorant, he shall be ignored. And in the Gospel, where the Lord says to sinners: "I know you not, depart from me, workers of iniquity". For just as it is said elsewhere: "The Lord knows who are his"; so here the Lord is said to know not the days of the impious, but of the spotless. For the days of the spotless are worthy of the knowledge of the Lord. But even this I do not know whether it can be consistently expounded according to the letter. For how can there be days of the spotless which are not also of sinners? since the day of this age is one and the same for all, and in the same light both the righteous and sinners alike are engaged: as the Lord himself says of the Father, that "he commands his sun to rise upon the good and the evil". How then here is the Lord said to know the days of the spotless as though something excepted and set apart? But let us see whether perhaps each one makes for himself his own day. And if ever, casting away lying, we speak the truth with our neighbor, we are engaged in the day of truth and in the light of truth. Likewise also, when we withdraw ourselves from those who hate their brothers, and walk in darkness, and remain in the love of the brothers, we make for ourselves the day of charity. But also when we keep righteousness, and when, visiting widows and orphans in their tribulation, we keep ourselves spotless from this age, we make for ourselves days of the spotless. And these are the days which he is said to know, when he knows the days of the spotless. But if we wish to examine a still more sacred sense in this place, we can say that the days of this age are evil, according to what is written: "Because the days are evil". But there are other, good days, which are themselves also of the spotless, which the Lord knows, in which also their inheritance remains forever; then without doubt, when the righteous shall take the inheritance of eternal life, obtaining the things which "eye has not seen, nor ear heard, nor has it ascended into the heart of man, which God has prepared for those who love him". Those are the days of the spotless, in which not this sun which the setting overtakes, and whose light the succeeding night destroys, but the sun of righteousness will shine, which knows no night, which is eternal light, as it is written, that "the Lord himself will be to them everlasting light".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily03.html'
source_title="HOMILIES ON PSALMS 37, HOMILY III"
