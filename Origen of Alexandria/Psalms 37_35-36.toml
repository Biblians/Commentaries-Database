[[commentary]]
quote='''
"When the sinners shall have perished, you shall see". Perhaps this will be first, that the righteous may see the sinners and the impious condemned. For to sinners first are decreed penalties and punishments: and when the righteous shall have seen these, and shall have recognized what difference there is between a good life and an evil one, and shall have understood from what great evils they have escaped by living well — so that those who are in punishments, seeing them in glory, say: "We fools thought their life madness" — after therefore they shall have seen how the sinners perish, then they themselves shall be exalted and borne up to heaven that they may inherit the earth. Now the word admonishes and applies a solace to this matter which frequently enough beats upon the heart of almost all men. For, because frequently we who are weak, seeing certain wicked and impious men passing their life in this world with all felicity and flourishing in prosperous successes, abounding in riches, honors, rejoicing in fruitful and entire offspring, floating in delights — we are scandalized and say in our hearts: Where is the justice of God? If things were governed by divine providence, would God permit this wicked and impious man to ascend to so great a felicity? Therefore now on this account the divine word says, in the person of the righteous: "I saw the impious" not only exalted, but "super-exalted and lifted up", not above trees of any kind whatever, but "above the cedars of Lebanon": so that the tree is exceedingly lofty, and the place upon the mountain higher than all; and yet, seeing all these things, "I passed by", he says, "and behold, he was not". What do you suppose that is which the righteous passes by, that this elevation may cease? If you remember, in the passages above, when we said that Moses passed over to see the great vision, you can also now know what it is that the righteous is said to pass by. When we see the impious exalted and growing into excessive pride, let us too pass over, in mind and understanding, from these things which are seen and are temporal, and let us transfer our sense to those things which are not seen and are eternal. Let us consider that these things which are seen exalted are temporal and of a few days. Let us gaze upon the day of judgment, and thus with our sense we shall discern that this man who is super-exalted and lifted up like a cedar of Lebanon, in the day of judgment shall be altogether not. For he who is not a partaker of Him who always is — that is, of Him who said: "I am who I am" — this man is said not even to be. And so sinners are not reckoned to be. Whence the Apostle too, concerning the calling of the Gentiles, said: "God has chosen the things that are not, that he may destroy the things that are". And in the book of Esther it is said: "Do not deliver, O Lord, your sceptre to those who are not". So long therefore as anyone admires the proud in their elevation, so long as anyone flatters sinners and the proud, it is certain that he does not pass over nor has he seen the things that are not, but that he remains in this present state, and on that account admires in them the present glory. But if he passes over in that manner which we said above — that is, in mind and sense transcends from things present and temporal to things future and everlasting — then truly he says of him whom he had seen lifted up like the cedars of Lebanon, that "I passed by, and behold, he was not"; since even heaven itself and earth shall pass away. With God all things which are to come are already held as done. Thus he said: "They gave gall for my food", which without doubt was still to come, and yet was said to be already done. "In my thirst they gave me vinegar to drink", and he did not say: they will give to drink. Thus therefore with God the things which are to come are already said to be done. But if you too are an imitator of God, and you imitate Christ, you do not wait until this exalted man be humbled and extinguished, but with yourself and in your mind and soul you already discern those things to have passed away, if you yourself in sense and mind pass over from things present to things future. Take also an example for these things which we say. If you are sailing, placed in the ship you see lands and promontories and mountains passing by: not that they are continually moved, but because you, while the favorable wind blows, pass by, and they seem to withdraw and be borne away; so also in this, therefore, if — with the Holy Spirit breathing and blowing upon your mind — you sail with a favorable and prosperous course, you pass through in your sense all these things which are seen, because they are temporal, and you gaze upon those things which are eternal; without doubt you say that all these things which are seen already are not, because they are not even to come. "I saw" therefore "the impious super-exalted and lifted up above the cedars of Lebanon, and I passed by, and behold, he was not". Something further still moves me in this place. For I see also another impious one who is exalted above the cedars of Lebanon and lifted up. For when heretics feign for themselves some other God above God the Creator, and are exalted and lifted up in a word of falsehood, denying that God the Creator of all things is a good God, they are lifted up by their impious preachings above the cedars of Lebanon — that is, standing out among the adversary powers, by whose inspiration they have contrived such fabrications against God the Creator of all things, for the reason that, understanding the law only according to the letter, and being ignorant that it is spiritual, they were deceived in their thoughts. These men, therefore, if I see and pass by, they will no longer be. What do I pass by? If I pass by the letter, if I pass beyond the surface of the history, and arrive at the spiritual sense — since the law is spiritual — if I explain spiritually all those things in which they err and are deceived, their impious and iniquitous doctrines will no longer be. And thus it will be fulfilled that the impious man, exalted and lifted up, as I pass by will no longer be. But also, when his place is sought, it is not found. The place of the impious doctrine is the letter of the law, which letter kills. When therefore we pass over from the letter that kills to the spirit that gives life, not even the place of the impious doctrine, when the letter is repudiated, can be found. But how do we seek it? When we dispute against them and inquire together with one another, then we seek the place of that doctrine in the letter of the law of the history, and it is shown that, according to the history, it cannot stand: the letter being removed and cast off, nowhere at all, when we seek and discuss, is the place of the impious doctrine found.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily05.html'
source_title="HOMILIES ON PSALMS 37, HOMILY V"
