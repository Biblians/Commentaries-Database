[[commentary]]
quote='''
But since we sin most of all at that time, when the sinner stands against us, instigating and provoking us to send forth from our mouth something such as would hold us guilty in the future judgment, the holy Prophet, describing this, says: "While the sinner stood against me, I was dumb and was humbled and kept silence from good things". Whenever the sinner stood against me and spoke ill of me, and disparaged and irritated me to render him the like, and to bring forth from my mouth things equal to his, I at that time meditated silence, so as to answer nothing at all. Therefore he says: "While the sinner stood against me, I was dumb and was humbled and kept silence from good things". But we sometimes, if we are unwilling to be humbled, think other things and say within ourselves: What is this? This man has held me in contempt and has dared to thrust such things in my face, and thus to stir up speech against me; shall I not bring against him the like, or even heavier things, so that he too may hear worse than he said? But the righteous man does not act thus, but rather humbles himself, even if the one who disparages and heaps abuse be a slave, or if he be lowly and a sinner and unworthy. He says: "While the sinner stood against me, I was dumb and was humbled and kept silence from good things". He did not say: "and I kept silence" only, but "I kept silence from good things"; wherein he shows that although there are good things in me, and I have been taught and instructed in good teachings and disciplines, and am able even to teach others the things that are good, nevertheless at that time when the sinner stands against me and assails me with abuse and reproaches, I even restrain and repress my good words: lest either I inflame in him the fire of his own perdition, while he is not able at once to obey evil things and to behold good things, or I do harm to my words. What then? Will this seem to be perfect which he says: "While the sinner stood against me, I was dumb and was humbled and kept silence from good things"? Or is it indeed a progress, yet not yet perfection? For in this place I think three things can be assigned from the Scriptures, in which he says that the sinner stands against him, and speaks in his ears the things by which he can be irritated and exasperated to retaliate. And if indeed I am small, I seek the like, and an eye for an eye, a tooth for a tooth, and I repay curses for curses. But if I have already advanced somewhat, yet am not yet perfect, I both keep silence and bear the reproaches patiently, and answer nothing at all. But if I am perfect, I do not keep silence, but when I am cursed, I bless, just as Paul also said: "We are cursed and we bless, we suffer persecution and we endure it, being blasphemed we entreat". And since those who do these things, that is, who render blessings for curses, who for blasphemies entreat, seem to men to be as it were cattle and refuse, as those who have no sense of injury, therefore he added, saying: "We are made as it were the refuse of this world, the offscouring of all". But we are unwilling to become with the apostles the refuse of this world, but wish not to be despised by men, nay rather even to be feared, and we do enough to repay those who harm us, and to anticipate the vengeance which the Lord reserved for himself, saying: "Vengeance is mine, I will repay, saith the Lord". But if we cannot advance so far, and ascend to that summit of truth, so as to say with Paul: "We are cursed and we bless, we suffer persecution and we endure it, being blasphemed we entreat", let us at least say this which we are still taught through the Prophet: "While the sinner stood against me, I was dumb and was humbled, and I kept silence from good things".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily08.html'
source_title="HOMILIES ON PSALMS 39, HOMILY I"

[[commentary]]
quote='''
And what did he add to these things? "And my sorrow", he says, "was renewed". Those who in the struggle of the contest engage in mutual blows against one another always try to prepare themselves in these things, so that they may bravely bear the blows inflicted on them by their adversaries, and not receive the sense of pain, and this is for them the highest excellence: to sustain the strokes of arms or of heels without pain. Among these, that man is more perfect who, at the stroke of the wound, receives no sting of pain. But the second is he who indeed feels pain, but by no means yields to the pains. Understand something of this sort also in ourselves, when we are cursed, and the antagonist stands against us; if indeed we are well instructed, and strengthened in mind by long meditation, we are in no way at all grieved by the curses or reproaches inflicted, but by reason of the exceeding constancy and patience of mind we are as though lacking the sense of pain, and through much meekness, if I may dare so to name it, we become in a certain manner as it were imitators of God: for God is cursed by heretics, is blasphemed by those who deny his providence, is blamed by those who are ignorant of the treasures of his wisdom: and tell me, can you at all think this, that for all these injuries God indeed feels pain, but suffers as we do? Or is it not that, as the divine nature through its impassibility, it neither receives the sense of pain in any way, nor is stirred by any injuries or reproaches? Such therefore will he be, nay rather every perfect and righteous man will imitate such a one as he was who said: "We are cursed and we bless, we suffer persecution and we endure it, being blasphemed we entreat". But he who is not yet perfect, yet advances, when he is cursed is dumb and is humbled and keeps silence from good things. But this man who is of this sort feels pain and says: "And my sorrow was renewed". Describe to me a wound that is being cured, and its cure advancing and now near to the scar: then next, upon that very wound which had already begun to draw over a scar, behold another wound inflicted, and through this fresh wound that former one renewed. Such a thing also befalls this man who advances, but is not yet perfect, nor has yet been brought to the highest health. If therefore, while the skin is still tender, the wounds of curses and reproaches come upon him, the sorrow is renewed, and distresses are made ready, and then he rightly says: "While the sinner stood against me, I was dumb and was humbled, and I kept silence from good things, and my sorrow was renewed". See therefore how he who is placed in the struggle, who desires to restrain himself from wrath or rage, and while he meditates these things within himself, and the irritation of the sinner comes upon him, which indeed disturbs and wearies him, yet does not conquer him, but although he is provoked and inflamed to answer, yet gnawing back his sorrow he restrains and represses it, this man says: "My sorrow was renewed". For the reason, namely, that I was already advancing, and already believed myself to have arrived at health, before I was exasperated, and before I was assailed with reproaches; but now my wound is torn open, and is renewed by the sword-points of cursing, while the sorrow of the injury breaks my patience.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily08.html'
source_title="HOMILIES ON PSALMS 39, HOMILY I"
