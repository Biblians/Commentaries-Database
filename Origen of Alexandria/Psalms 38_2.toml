[[commentary]]
quote='''
But he who says this ought to bring forward some reason why he does not wish to be reproved in wrath, or to be corrected in anger. And let us see what that reason is, so that if we offend, we, learning this reason and doing according to what we are taught, may not fall into the vengeance of the one reproving in wrath, or of the one correcting in anger. "For," he says, "your arrows are fixed in me, and you have confirmed your hand upon me." The word of the Lord is like arrows. Indeed, the Savior too said thus: "He has set me as a chosen arrow, and in his quiver he has hidden me." He, therefore, who speaks the word of the Lord shoots arrows. And when he speaks correcting and chastening, he pierces the heart of the hearer with the dart of correction. He, therefore, who so receives the words of the Lord that from the words he hears his heart is pierced, and through the goad of the things that have been spoken he is roused to repentance — it is certain that in him the dart of God's word has not gone forth in vain, nor has it flown past, but in him all those arrows of God's words have been fixed. Indeed, thus he says also in a certain place: "Have you seen how Ahab was pricked to the heart?" Rightly, therefore, does the Prophet now also say: "O Lord, rebuke me not in your wrath, neither correct me in your anger." For the cause that follows is worthy — the cause that ought to temper for him the correction of the Lord's wrath — since your arrows are fixed in me. For example, if now, out of all this multitude of hearers, there are some conscious to themselves of some sin — and would that indeed there were none! yet it is necessary that there be some conscious to themselves — and if these, upon hearing the things we speak, hear rightly and faithfully, and their heart is pricked by the darts of our words, and, pierced by such darts, they grieve and, turned to repentance, say: "O Lord, rebuke me not in your wrath, neither correct me in your anger, for your arrows are fixed in me." But if one hearing these things is not pricked, but, as in a body already dead, so in his soul no arrow, no dart finds any feeling of pain, nor does he take up any remembrance of his sins — such a one is indeed worthy to be corrected by the goads of the Lord's wrath, and to be reproved by the corrections of his anger. For he cannot say to the Lord: "For your arrows are fixed in me." And would that all of you may hear us, pricked and goaded by the things that are said, and, turned to repentance, may say to the teacher: For your arrows are fixed in me, and while you chasten us with the word of God, while you scourge, while you strike us in the inner parts of the conscience: "You have confirmed your hand upon me." For the tutor confirms his hand upon children while he scourges and amends, and the hands are confirmed when the blows are not inflicted negligently or lightly. So too can one say to the Lord, when he has sent arrows — but through whomever he wishes to send the arrows of his words — that "you have confirmed your hand upon me." For when the hand of the Lord is present, which sends forth the darts of words and fixes the arrows in the soul of the hearers, rightly does he say to the Lord that "you have confirmed your hand upon me: nor is there health in my flesh in the face of your anger."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily06.html'
source_title="HOMILIES ON PSALMS 38, HOMILY I"
