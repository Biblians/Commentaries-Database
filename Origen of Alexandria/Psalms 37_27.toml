[[commentary]]
quote='''
"Turn aside from evil and do good, and dwell forever and ever". Hearing these things, he says, do what is good, thou shalt dwell forever — that is, if thou shalt act as thou hast been taught, thy dwelling shall be eternal. For if thou look not to the things that are seen, but to the things that are not seen — since the things that are seen are temporal, but the things that are not seen are eternal — thou shalt dwell forever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily04.html'
source_title="HOMILIES ON PSALMS 37, HOMILY IV"
