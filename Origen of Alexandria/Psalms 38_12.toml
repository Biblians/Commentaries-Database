[[commentary]]
quote='''
Therefore "my neighbors stood afar off, and they who sought my soul did violence. And they who sought evils for me spoke vanity". These things again he says of others. For there are certain men who seek evils for the righteous, and do not rejoice so much when they hear something of his good deeds as they take glad congratulation when they hear evils, and, as it were, exult when they see the righteous man in some evils. And these are they who, when they have seen the righteous man confessing his sins, vomit out, as it were, some harmful venom; on account of which he says: "And they who sought my soul did violence. And they who sought evils for me spoke vanities". And truly it is most manifestly perceived that not only those who seek evils for the righteous, but everyone who tries to inflict evils upon anyone whatever, speaks vanity. For he who seeks to do evils does not speak those things which are according to God. Whence it behooves us rather to seek good things. Would that we might even repay good for evil to those who hate us, and either persuade our enemies of the things that are good, or wish to recall their fierce spirits to concord and peace, so that through this "we may become sons of the Father who is in heaven, who commands His sun to rise upon the good and the evil, and rains upon the just and the unjust".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily07.html'
source_title="HOMILIES ON PSALMS 38, HOMILY II"


[[commentary]]
quote='''
"They, therefore, who sought evils for me spoke vanities, and meditated deceit all the day long". See the one who lies in ambush for the righteous. For I already call righteous the one who becomes "his own accuser in the first place", as the word of Scripture indicates. For just as Scripture calls that man wise who, when he is reproved, does not hate the one who reproves him, but rather loves him: so also he is called righteous who, after his transgression, does not persist in his transgressions, nor awaits that the devil become his accuser, nor that the devil bring his sins forward into the midst, but himself reproves and convicts himself, and through his confession is freed from death. For "they who sought evils for me spoke vanity, and meditated deceit all the day long. But I, as though deaf, did not hear". Nothing more excellent than this virtue, nothing more surpassing, can be found: that each one, hearing his slanderers and detractors speaking evil, carping, disparaging, accusing, should himself turn away his ear as though not hearing, and turn aside his eye as though not seeing, lest he be exasperated by wrath and leap forth to vengeance, lest he seek an eye for an eye, nor a word for a word, nor a curse for a curse, nor a lie for a lie, nor a charge for a charge. Such, therefore, is the righteous man: for already, as I said, I call him righteous who through his confession of his sins vomits out his passions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily07.html'
source_title="HOMILIES ON PSALMS 38, HOMILY II"
