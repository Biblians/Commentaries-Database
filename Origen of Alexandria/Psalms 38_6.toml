[[commentary]]
quote='''
"I have been afflicted with miseries and bowed down even to the end." But you may sometimes see the man who has sinned mourning and saddened with the sorrow that is according to the world; for the sorrow that is according to God works repentance unto stable salvation. But this man says that I have been afflicted with miseries and bowed down even to the end. For this reason perhaps the holy Apostle himself, knowing that he had once sinned, says: "Wretched man that I am, who shall deliver me from the body of this death?" For he too sinned when he persecuted the Church of God, on account of which he says: "I am not worthy to be called an apostle." I have been afflicted with miseries, then, he says. He does not say, I am still afflicted. For if my sins have now passed away, I have been afflicted with miseries; but if they remain, and I am conversant in them, I am still afflicted with miseries: "With miseries," then, he says, "I have been afflicted, and I am bowed down even to the end." If you should see the man who has sinned unable to look up to heaven, but with his body bent and the countenance not only of his body but also of his soul sunk to the ground, and twisting his neck like a hoop, you understand how one is bowed down even to the end. But if you wish also through examples to know how each one is bowed down by his sins, so that he cannot look up nor lift his eyes to heaven, gaze upon that publican who in the Gospel, having entered the temple and standing afar off, not daring to lift his eyes to heaven, but striking his breast and confessing his sins, said: "God, be merciful to me a sinner." To this man surely it is fitting to say, "I am bowed down even to the end, and I went about all the day saddened." And in saying this, he sets forth, as it were, the very disposition and soul of the penitent, who says: From the time I sinned, I have never laughed, I have never been glad, I have never indulged myself in anything of enjoyment, but I have always been in mourning, always in repentance, always in grief. Such is that which is enjoined in the Gospel, when the Lord says: Blessed are they that mourn, and blessed are they that weep. But on the contrary, if anyone is a sinner and liable to many evils, and this man, pricked by no goad of his own outrages, moreover even laughs and is glad and merry, and is not driven in any respect by the goads of conscience, see whether to this man it is not fitting to say the things that are written: "Woe to you that laugh now, for you shall mourn and lament."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily06.html'
source_title="HOMILIES ON PSALMS 38, HOMILY I"
