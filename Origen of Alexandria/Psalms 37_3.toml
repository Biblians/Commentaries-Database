[[commentary]]
quote='''
After he said that those who work iniquity fall away quickly like the green herbs, and forbade being jealous among the malignant, and imitating those who work iniquity: then he says what we ought to do. "Hope", he says, "in the Lord, and do goodness". Having despised, that is, all those things which were censured above — honors, riches, and all carnal glory, and all the goods of the age — hope, he says, in the Lord. But hoping in the Lord, do not be idle; but doing goodness, hope in him. But what this goodness is, let us see. It is one of those springs which the Apostle enumerates as being fruits of the Holy Spirit. "Now the fruit of the spirit is charity, joy, peace, patience, goodness and righteousness". Do goodness therefore, as if he were speaking to a field, saying, Bear this fruit or that: so now to you, the hearer of the divine Scriptures, the divine word speaks as to a field. "Do goodness, and inhabit the earth, and you shall be fed in its riches". Do not be like withering grass, do not become like the green herbs, which will quickly fail, but hope in the Lord, and do goodness, and inhabit the earth. What earth does he bid us inhabit if we have done goodness? Surely, if he were speaking of this earth which we inhabit — both those who do goodness and those who do not do it inhabit this earth. The commandment therefore seems to be superfluous if this earth is understood. But let us see whether perhaps he means that earth of which it is written, that other seed fell upon the good earth, which bore fruit — in which the earth now seems to signify the heart of the hearer. This therefore we are bidden to inhabit, that is, not to wander farther off, not to run to and fro beyond and short of it, but to dwell, and to abide within the bounds of our soul, and to consider it more diligently and become its farmer, just as Noah was, and to plant in it a vineyard, and to till the earth which is within us, to renew the fallow ground of our soul, and not to sow upon thorns: namely, when we purge our soul from vices, and cultivate our uncultivated and rough manners toward the meekness of the imitation of Christ, and so at last are fed from the riches of the virtues. For it is not to be thought that we are commanded to seek earthly riches, which we are bidden to despise and spurn. He says therefore: "Inhabit the earth". This is therefore: attend always to your soul, there abide always, and cultivate your earth, so that, when you have begun to abound in the fruits of righteousness, then you may be fed in its riches. But what is it to be fed in its riches? Because "whatever a man has sown, this also he shall reap". And: "He who sows in the flesh, from the flesh shall reap corruption. But he who sows in the spirit, from the spirit shall reap eternal life". But if you inhabit your earth, and have sown it in the spirit and not in the flesh, you shall be fed in its riches, like those sheep which are said to be fed in a green place, of which the divine word says: "In a green place, there he settled me". Whence it is established that each one of us himself prepares within himself a green place, in which he is fed by the Lord, when he cultivates the fields of his soul, and, sowing in the spirit, always brings it to the gladness of spiritual cultivation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily01.html'
source_title="HOMILIES ON PSALMS 37, HOMILY I"
