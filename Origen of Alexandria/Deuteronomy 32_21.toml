[[commentary]]
quote='''
Yet what is it that she, among whom the law was both born and nursed, receives the wages of her nursing from the daughter of Pharaoh? What is it that the synagogue receives from the church? I think it can be understood as that which the same Moses writes, saying: "I will lead you into jealousy over that which is no nation, over a foolish nation I will provoke you to wrath." The synagogue, then, receives this as its wages from the church, that it no longer worship idols. For seeing those who are of the nations so converted to God that they no longer know idols, and venerate no one except the one God, she herself is ashamed any longer to worship idols. This benefit, therefore, the synagogue receives from the church, in that she was seen to have nursed the law as a little one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily02.html'
source_title="HOMILIES ON EXODUS 2"

[[commentary]]
quote='''
It is written in Deuteronomy: "They provoked me to zeal in what is not God, they roused me to anger in their idols, and I will bring them to zeal in what is not a nation". Here, where in Latin it is said, "they brought me to zeal, and I will bring them to zeal", in the Greek it is the very same word that was spoken at the beginning of the psalm, that is, "they were jealous of me, and I will be jealous of them". Although that Greek word itself, that is, παρεζήλωσαν, would seem to be more significantly expressed in Latin if we should say "they provoked me", yet it is the very same word. From all these testimonies it is indicated that to be jealous of someone is to provoke and to rouse him. Finally, since that saying of Deuteronomy, in which he says, "They brought me to zeal in what is not God", that is, παρεζήλωσαν, means this, it becomes more clearly manifest from this what is written elsewhere, that our God is called a jealous God. Now a husband is wont to be called jealous concerning his wife, when he cares for her chastity more anxiously and cautiously, and does not allow the chastity of his spouse to be defiled. Whence it follows that he who sins provokes and rouses to jealousy God, who is called jealous. But all these things are to be heard of God abusively, just as also those things which are said of the wrath of God, or of sleep, or of sorrow, through which is understood what each one of us deserves from God for his own deeds. Finally, thus he said in Deuteronomy, that "they brought me to zeal in what is not God, and exasperated me in their idols", that is, by worshiping idols they roused me to zeal. But what follows? "And I will bring them to zeal in what is not a nation, in a foolish nation I will provoke them". Whence even now the Jews are not stirred against the gentiles, against those who worship idols and blaspheme God, and they do not hate them, nor are they indignant against them; but against Christians they are borne with an insatiable hatred — Christians who indeed, having left idols behind, are converted to God. When therefore you see the Jews holding a Christian in hatred and lying in wait for him, understand that that prophecy is fulfilled which says: "And I will rouse them by what is not a nation". For we are "not a nation," we who believe a few from this city, and others from another, and nowhere does a whole nation appear to have been taken up from the beginning of belief. For it is not as the nation of the Jews was, or the nation of the Egyptians, that in like manner also the race of the Christians is one nation, or a whole one, but they are gathered scatteredly out of the several nations. He says therefore, that "I will bring them to zeal by what is not a nation, in a foolish nation I will provoke them". And therefore they are provoked against us, and hold us in hatred as a foolish nation, saying that they themselves are wise, since indeed to them first the oracles of God were entrusted, and, meditating on the law of God from boyhood even to old age, they did not attain to the law of God; but for this reason God chose the foolish things of this world, that he might confound the wise, and thus is fulfilled what is written: "In a foolish nation I will provoke them".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily01.html'
source_title="HOMILIES ON PSALMS 37, HOMILY I"
