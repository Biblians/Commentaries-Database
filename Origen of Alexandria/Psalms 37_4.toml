[[commentary]]
quote='''
The expression "we have need" is applied to those things that are necessary for life. Consequently, applied to material things, it means that one does not need most things but only those of which Paul says, "but having food and clothing, we shall be satisfied with these things." Those things, [by contrast], that are accumulated in wealth and luxury are the result of abundance among those who live luxuriously. They are not considered to be necessary and absolutely essential but to be superfluous. So, therefore, there are also things that are necessary for us in the realm of divine matters, which bring us into life and cause us to be in the one who says, "I am the life." But what supersedes these things would be said to supersede need. It is said of such things, "Delight in the Lord, and he will give you the requests of your heart." These include all the things that are considered in relation to the paradise of luxury and in relation to wealth and glory, the things in the left hand of wisdom according to him who said, "For length of life and years of life are in her right hand, but in her left hand are wealth and glory." One would say that these go beyond necessity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520John%2FBook%252032.html'
source_title="COMMENTARY ON THE GOSPEL OF JOHN 32:106"

[[commentary]]
quote='''
"Take delight in the Lord, and he will give you the petitions of your heart". It is the custom of divine Scripture to introduce two men by ὁμωνυμίᾳ, that is, to name the one from the other by likeness of the other — that is, to apply the things which are of the outer man also to the inner. But what I say is this: The outer, corporeal man feeds on corruptible foods, and those suited to him. But there is also a certain food of the inner man, of which it is said that man lives in every word of God. There is a drink of the outer man, there is another of the inner. For we drink from the spiritual rock that follows, and we drink water which, as Jesus says, "whoever drinks, shall not thirst forever". There is also a garment of the outer man, there is also a garment of the inner man. And if indeed he is a sinner, he clothes himself with cursing like a garment. But if he is righteous, he hears: "Put on the Lord Jesus Christ". And: "Put on the bowels of mercy, kindness, humility, meekness, patience". And what need is there to relate through particulars how the inner man is named by the homonymous appellations of the outer man? The outer man and the inner man have arms. He who wars according to the inner man is clothed with the arms of God, that he may be able to stand against the wiles of the devil. But after many examples, let us come to what has been proposed. Let us see what is signified by that which was said: "Take delight in the Lord, and he will give you the petitions of your heart". It must first be known that this which I have said in Latin, "take delight in the Lord", in the Greek is said, "take your delights in the Lord". For this is what the Greek word indicates: which is κατατρύφησον. As therefore according to the outer man it is possible not only to use foods, but also to enjoy delights, and especially those who are rich enjoy delights; so likewise the inner man can not only use foods, but also enjoy delights. Which I think comes about in this way. If anyone hears only those words which invite him to the fear of God, this man takes only food from a word of this kind. But he who gives diligence to understanding the law, to searching through the prophets, to the resolutions of the parables of the Gospel, to the explanation of the apostolic words, and who in all things gives diligence to understanding and knowledge, this man enjoys delights. For he uses the food of the commandments not only for that which suffices him for life, but takes delight in all the acknowledgment of knowledge. This is what I think is indicated in that too, in that God is said from the beginning to have planted a paradise of delights, without doubt one in which we might enjoy spiritual delights. But also elsewhere: "A torrent", he says, "of delights you will give them to drink", namely the saints. But here too I know that in the Latin copies it is wont to be held "the torrent of your pleasure", but in the Greek is held τρυφῆς, which is "of delights". But also to all the saints a contempt of corporeal delights is enjoined, and a hope of spiritual delights is promised in return. Do you wish also to receive authority of the divine Scripture concerning this? There was a certain rich man, and Lazarus a poor man; the rich man was in corporeal delights, Lazarus was wasted with hunger. Each departed from the age, and Lazarus indeed was taken up by the angels into the bosom of Abraham, that there he might rest in delights; but that one who had been in corporeal delights went off into the gehenna of fire, as it is in the Gospel, and hears from Abraham, that "you have obtained good things in your life", that is, you have abused delights, "and Lazarus evil things: but now here he rests, while you are tormented". No one can have delights both in the flesh and in the spirit. But if anyone takes delight in the flesh, like that rich man, he will lack the bosom of Abraham and its delights. But he who in the present age feeds on the bread of affliction, like that poor man, when he has departed hence, will be in delights. "Take delight" therefore "in the Lord, and he will give you the petition of your heart". But if you wish still more fully to see how one takes delight in the Lord, perceive that the Lord is truth, and is wisdom, and is righteousness, and is sanctification. If therefore you abound in the riches of truth, if you abound in the understanding of wisdom, if you are copious in the acts of righteousness, then you take delight fully and entirely in the Lord. And when you have fulfilled these things, then you will also obtain that which follows. For "the Lord will give you the petitions of your heart". Yet necessarily he added "the petitions of your heart", when he could surely have said your petitions. But thus it can be more easily understood. For if a certain proper person of each of the members be imagined — for example's sake, if the eye had a voice, would it not say: I ask for light, that I may see those things which delight me to see? For I shun to see any horror, and everything that disturbs and saddens the sight. Similarly, if the hearing received a voice, would it not say: I ask for a sound composed with measured art, a delightful sound, but I shun to hear anything harsh and terrible? So if a voice were given to taste, and to touch, all our senses without doubt would ask for those things which suited their own sense. From these therefore let us pass over to the heart, in which is the mind, and the principal understanding, and let us see what the heart desires and what it asks, just as concerning the eye or the ears and the other senses we have shown in the foregoing. According to its own nature the heart without doubt demands understanding. As the eye demands sight, so the heart requires understanding. As the ear desires a sweet sound, so the heart takes delight in wise perceptions. As taste in a sweet savor, so the heart rejoices in prudent thoughts. As smell in the sweetness of fragrance, so the heart is glad in rational pursuits. As touch in soft and gentle things, so the heart takes delight in useful and excellent counsels. If therefore you take delight in the Lord, and enjoy the abundances and delights of wisdom, and of truth, and of righteousness, the Lord will give you the petitions of your heart, suited to the delights spoken of above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily01.html'
source_title="HOMILIES ON PSALMS 37, HOMILY I"
