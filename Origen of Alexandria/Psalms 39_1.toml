[[commentary]]
quote='''
Just as one man advances according to God, and by applying zeal to himself becomes better than his former self, so also it used to happen to the whole people. And on this account, as it too advanced, there came to it also an increase of the law. In short, just as it is written in the law, there are certain precepts for the priests and Levites concerning sacrifices and the other solemn observances: yet when the people advanced, at that time when there was still in it the power of advancing, the matter did not stand still in that first order, but there were bound to those men certain more eminent legislations, a second and a third. And if anyone wishes to know what these things are that were added concerning the priests and Levites, let him read the first book of Chronicles, and let him patiently examine that whole catalogue of names, and he will find there a certain admirable order and a distribution of the tribes, each according to its own name and place having received by lot something distinctive in the solemn order. But he will also find the Levites and priests distributed among various offices and orders, so that some are set over the opening of the doors of the temple, others to whom the keys are entrusted, to others the care of the sacrifices and the altars is committed. And there are many things which from the history of that book we can say about the priestly institutions. If therefore anyone is able to observe how the Jews serve a copy and a shadow of the heavenly things, let him ascend from the lower foundation of the word to its highest and uppermost summits, and let him contemplate from these the state of the priesthood to come and that heavenly election, and there he will contemplate what these priestly orders are, or what are the offices of the Levites that are exhibited in the heavenly ministries, and he will conceive in his mind all things in the heavens which he saw laid down on earth. For there too there will be a people, and from the people of God chosen Levites, and from these again chosen and distinguished priests, and among the priests nonetheless very many differences: just as in the first book of Chronicles it is indicated that there are twenty-four orders of priests, some under Eleazar, others under the chief Ithamar, whose courses (Ephemeriae) they are also said to be.

But perhaps someone of the hearers may say: What do these things pertain to the psalm? Very much. For it is the superscription of this psalm. "Unto the end, for Idithun, a psalm of David". This Idithun we find to be one of those to whom the zeal and care of hymns to God was committed. It was therefore necessary for us, finding this name in the superscription of the psalm, to show who this Idithun was, and how, after the first law, a second ordinance was made concerning the priestly observances. Among the Greeks, whoever composed songs or musical tunes furnished them to be sung by those to whom it seemed good in the contest: and it came about that one man indeed was crowned in the contest, while another composed the song for the victor. In the Psalms therefore of divine Scripture, whoever are superscribed according to the Seventy translators, unto the end, are among others titled victory-songs, or for the victory, or for the victor, evidently for the reason that as it were a praise of victory is brought into them. David therefore, filled with the divine Spirit, made this psalm, and gave it to Idithun, upon whom the office of singing hymns to God had been enjoined, as to one powerful in this kind of discipline. And therefore for this reason it is superscribed: "Unto the end, for Idithun, a psalm of David".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily08.html'
source_title="HOMILIES ON PSALMS 39, HOMILY I"

[[commentary]]
quote='''
But now let us at last see what the voice of the righteous man utters, and, seeing ourselves as though in a mirror, let us look at ourselves, whether we can be such, or whether much is lacking to us, or whether indeed we are now near, although we have not yet fully attained. Since therefore the beginning of many sins is human speech, and our mouth serves many evils, and it is very difficult to find a man who, for even one hour at least, keeps his mouth and his tongue from sin, he says: "I said: I will keep my ways, that I sin not with my tongue". I said to my very self, and I spoke within myself, and I added these things: Thus I wish to keep my ways, that I sin not; in this way I can keep them, if I guard my tongue. "For by thy words", he says, "thou shalt be justified, and by thy words thou shalt be condemned". And again: "Amen I say to you, for every idle word you shall render an account in the day of judgment". Not only, he says, for that which you have spoken ill, but for what you have spoken idly, because an evil word is not idle, for it works an evil work. But an idle word is one that does neither anything good nor anything evil. If therefore in the day of judgment we shall render an account not only for evil words, but even for idle ones, who shall boast that he has a chaste heart? Or who is confident in saying: I am clean from sin? Nevertheless the righteous man says: "I said: I will keep my ways, that I sin not with my tongue. I set a guard to my mouth". Elsewhere indeed it is written: "With all keeping guard thy heart", but here: "I set a guard to my mouth". And again elsewhere it is written: "See, draw a hedge of thorns around thy possession". And again: "Bind up thy money and thy gold, and make for thy mouth a door and a bar, and for thy words a yoke and a balance". I think that the observance of these commandments makes the one who observes them both meek and blessed, not only the outcome of things, but the very observance itself. For while he always watches his mouth, and guards his tongue, so as not to bring forth a word before he examines it and considers within himself whether it ought to be said, whether the word is such as ought to be uttered, whether the person is such as either ought to or is able to hear, whether the time is opportune for uttering the word: while he weighs each of these things, all wrath and fear is shut out, and the impulse of ill-considered rage is mitigated, and such a man cuts off entirely all deliberation; and so at last the word, proceeding as it were out of a certain tranquillity and a settled mind through meekness, affords grace to those who utter it and healing to those who hear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily08.html'
source_title="HOMILIES ON PSALMS 39, HOMILY I"
