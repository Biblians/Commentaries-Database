[[commentary]]
quote='''
And so, everything that is in the sentient flesh you can find also in the inner man. Do not doubt, then, also concerning the blood, homonymous with the sentient blood, which, like the other parts of the body, the inner man has. It is precisely this blood of which the soul of the sinner is deprived. For it is said: "The blood of your souls will be required." It is not said "your blood," but "the blood of your souls."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"


[[commentary]]
quote='''
If anyone come with simple mind and desire to the Church, that he may make progress, that he may become better, this man, if he see us who have already stood in the faith for a long time either not acting rightly or speaking with offense, we become to him an occasion of falling into sin. And when he has sinned, he is slain, and the blood of his soul flows out, all vital power departs from him. And if you hear it said in Genesis that "I will require the blood of your souls from every brother and from every beast", do not think that it commands so greatly about this bodily blood, as about the blood of the inner man, that is, about the life of the soul and the spiritual blood. For the blood of a scandalized soul is poured out when it has fallen into sin, and therefore he said that his blood is required from the brother. And why also from the beast? If he who scandalized you is faithful, he is a brother, from whom your blood is to be required. For he is your brother who shed your blood, and therefore it is said, "From the hand of the brother I will require the blood". But when a contrary power, wild and wicked, presses upon a man, and he is unfaithful through whom it lies in wait, if it has been able to shed the blood of your soul, that is, to cast you down into sin, it is a beast through which the Lord requires your blood. But Ezekiel the prophet too, when he says that he is set as a watchman for the house of Israel, who, if he announce the coming sword, does not become guilty of blood, but if he does not announce it, is guilty of blood; and in the law, when it is said, if he do this and this, he will be innocent of blood; without doubt here too he designates the blood of the soul, which is poured out through sin. Therefore let us all fear, lest perhaps the blood of someone who is scandalized be required from us, as the prophet designates.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily03.html'
source_title="HOMILIES ON PSALMS 37, HOMILY III"
