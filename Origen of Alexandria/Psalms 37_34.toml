[[commentary]]
quote='''
And therefore he says: "Wait for the Lord"; that is, if you are afflicted, if you are in straits, if you are in persecutions, "wait for the Lord, and keep his way", and turn aside neither to the right hand nor to the left. For if you wait for the Lord without turning aside, you shall obtain that which follows: "And he will exalt you", he says, "that you may inherit the earth". Frequently have we spoken concerning the holy earth, and concerning the earth which is named as the inheritance of the heavenly promises, whose nature — even its situation — is designated a little more evidently in this verse. For this earth in which we now live is said to be below, according to that which is written: "But God is in heaven above, and you upon the earth below". But that earth which is promised to the righteous as an inheritance is promised to be not below, but above. Therefore to him who waits for the Lord and keeps his way, the word of the promise says: "He will exalt you, that you may inherit the earth". For unless one be exalted and ascend on high and be made heavenly, he cannot attain the inheritance of that earth. Whence I judge that, just as of this heaven — that is, of the firmament — the lower ground alone, this dry land in which we dwell, is called its earth: so also of that higher heaven which is principally called heaven, the lower ground in which those heavenly inhabitants dwell, and, so to speak, the very back of this firmament, deservedly, as I said, is called the earth of that heaven — but a good earth, a holy earth, a great earth, an earth of the living, an earth flowing with milk and honey; and therefore now the divine word says: "He will exalt you, that you may inherit the earth".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily05.html'
source_title="HOMILIES ON PSALMS 37, HOMILY V"
