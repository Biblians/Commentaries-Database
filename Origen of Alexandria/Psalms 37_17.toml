[[commentary]]
quote='''
"For the arms of sinners shall be broken". How can this stand according to the letter, even if someone try to do violence to it through inexperience? There are many things so placed in the Scriptures which can move even him who is very brutish and snoring, nay, compel him, so that he must of necessity, the letter being abandoned, ascend to the spiritual understanding; as also now do these arms of the sinner, upon which he threatens the breaking to hang. But in another place too he says: "Break the arm of the sinner and of the malignant one". What then? shall we suppose that that bodily arm of the sinner and of the malignant one is to be broken? We do not see this easily come to pass. But if we consider how, when sinners have been lifted up into pride, and have prepared their bows, and have bent those arrows of theirs, of which we spoke above, against the righteous; when all this intention of theirs has been destroyed by the power of the Lord, so it is deservedly said that the arm of the sinner is broken. Or in another way, since the hand and the arm is an indication of work. If therefore you see the sinner not stretching out his hand to a good work, to a work of mercy, it will not be absurd to say that his arm is broken. But such a breaking must be believed to come not from God, but from the devil. For it is he who breaks and binds the arms of sinners, that they may not be stretched out to mercy. There comes to be, therefore, a certain breaking of sinners from God, when he destroys and frightens them as they lie in wait for the righteous; but a certain breaking from the devil, when he hinders the zeal for a good work, the arms of the unfaithful being as it were bound and broken. And there is another breaking, which is granted indeed by God, but fulfilled by the devil, that of which the devil was saying to the Lord: "But nevertheless put forth your hand and touch all that he has, unless he bless you to your face", and then he received him into his power. Whence Job himself also says: "For it is the hand of the Lord that has touched me".

"But the Lord upholds the righteous". Those who are weak and frail have need of one to uphold them. Where ruin and falling threaten, there support is sought. But every man, as far as regards human frailty, is both weak and prone to falling. And in this psalm indeed it is written that the Lord upholds the righteous, and in another he says: "The Lord upholds all who fall, and the Lord raises up all who are cast down". It is only for us to rouse ourselves at some time and to wake up, so that if ever through weakness some fall threatens, we may entreat the Lord to send us his word and his wisdom, which may uphold those about to fall and raise them up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily03.html'
source_title="HOMILIES ON PSALMS 37, HOMILY III"
