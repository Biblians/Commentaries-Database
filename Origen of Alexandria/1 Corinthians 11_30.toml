[[commentary]]
quote='''
When your soul is sick, and is pressed by the sicknesses of sins, are you untroubled, do you make little of Gehenna, and despise and mock the punishments of eternal fire? Do you make light of the judgment of God, and despise the Church that admonishes you? Do you not fear to communicate the body of Christ, approaching to the Eucharist as though clean and pure, as though there were nothing in you unworthy, and in all these things think that you escape the judgment of God? Do you not recall that which is written, that "For this cause many among you are weak, and sick, and many sleep"? Why are many weak? Because they do not judge themselves, nor examine themselves, nor understand what it is to communicate with the Church, or what it is to approach to such and so exceptional sacraments. They suffer that which the feverish are wont to suffer, when they take beforehand the foods of the healthy, bringing destruction upon themselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily07.html'
source_title="HOMILIES ON PSALMS 38, HOMILY II"
