[[commentary]]
quote='''
We ought, then, to say something also about correction, concerning which the Apostle teaches us generally, saying: "Every correction indeed for the present seems not to be of joy, but of sorrow; but afterward it will yield the most peaceable fruit of righteousness to those who have been exercised by it." And observe even children, how, when they are corrected with blows by their tutors, or are roused by their teachers, they take it grievously indeed, and judge that pain to be the greatest evil which is inflicted upon them for the sake of instruction; and although they are not ignorant that their advancement lies in instructions and corrections of this kind, nevertheless they bear it grievously and impatiently. But if the instruction of children is of this kind, what ought we to think about ourselves who are old, what sort of instruction or correction do we reckon to be hanging over us — one that is inflicted neither by stewards nor by tutors? For Scripture indeed knows the tutor and the steward and the guardian of a little child: what, I say, ought we to suppose or feel, when our instruction and correction has been carried out by the Father of the household himself?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily06.html'
source_title="HOMILIES ON PSALMS 38, HOMILY I"
