[[commentary]]
quote='''
"For I proclaim my iniquity". The proclamation of iniquity, that is, the confession of sin, we have spoken of rather often. See, then, what the divine Scripture teaches us: that one ought not to hide sin within. For perhaps, just as those who have shut up within an undigested food, or an abundance of humor or phlegm remaining heavily and troublesomely in the stomach, are relieved if they vomit: so also those who have sinned, if indeed they hide and retain sin within themselves, are pressed within, and are all but suffocated by the phlegm, or humor, of sin. But if one becomes his own accuser, while he accuses and confesses himself, he at once vomits out both the transgression and digests every cause of the disease. Only look around more carefully to whom you ought to confess your sin. First test the physician to whom you ought to lay open the cause of your sickness, who knows how to be weak with the one who is weak, to weep with the one who weeps, who understands the discipline of grieving-with and suffering-with: so that thus at last, if that one — who has first shown himself both a learned physician and a merciful one — shall say anything, if he give any counsel, you may do it, and follow it; if he understands and foresees that your sickness is such as ought to be laid open and cured in the assembly of the whole Church, from which perhaps others too may be edified, and you yourself easily healed, this is to be managed with much deliberation and by the sufficiently skilled counsel of that physician. "For I will proclaim my iniquity, and I will take thought for my sin". Whoever of you is conscious to himself of some sin, and is so untroubled as though he had done nothing evil, let him be moved by this word which says: "I will take thought for my sin". It is good that he who transgresses be not untroubled, nor, as though he had transgressed nothing, bear no anxiety, nor consider how he may be able to blot out his sin. If some stain or wound arise on your body, or it swell up from some bruise, you are anxious and inquire what care ought to be applied, how the former health may be restored to the body. If some bitter humor pour itself around the eyes, you are anxious, and inquire how you may succor yourself and forestall blindness. When your soul is sick, and is pressed by the sicknesses of sins, are you untroubled, do you make little of Gehenna, and despise and mock the punishments of eternal fire? Do you make light of the judgment of God, and despise the Church that admonishes you? Do you not fear to communicate the body of Christ, approaching to the Eucharist as though clean and pure, as though there were nothing in you unworthy, and in all these things think that you escape the judgment of God? Do you not recall that which is written, that "For this cause many among you are weak, and sick, and many sleep"? Why are many weak? Because they do not judge themselves, nor examine themselves, nor understand what it is to communicate with the Church, or what it is to approach to such and so exceptional sacraments. They suffer that which the feverish are wont to suffer, when they take beforehand the foods of the healthy, bringing destruction upon themselves. This much concerning that which was said: "I will take thought for my sin".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily07.html'
source_title="HOMILIES ON PSALMS 38, HOMILY II"
