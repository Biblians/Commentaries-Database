[[commentary]]
quote='''
There follows: "But my enemies live, and are strengthened over me". To all which that phrase ought to sound as an undertone: "But I will take thought for my sin". And though I see — for often we sinners, if we see our enemies living more boldly, are saddened, and pour out complaints against the divine providence. But he who wishes to be saved should always answer himself this to all these things: even if "my enemies live, and are strengthened over me", yet I "will take thought for my sin". And though I see that I am a sinner, yet, considering also the sins of others which are perhaps graver, seeing too that they are not anxious for their sins, comparing myself to those who consider nothing at all about their most grievous transgressions, and taking thought for my sin, I have hope in You.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily07.html'
source_title="HOMILIES ON PSALMS 38, HOMILY II"


[[commentary]]
quote='''
"And they who hate me unjustly are multiplied". It is impossible for one placed in this life not to be held in hatred. Christ Jesus was held in hatred. And why do I say it is impossible for one placed in this life not to be held in hatred? God Himself, who did not come into this life, is held in hatred by some. For if He were not held in hatred, the Prophet would by no means say: "Did I not hate those who hate You, O Lord, and pine away over Your enemies? With perfect hatred I hated them". The Marcionites, and Basilides, and the Valentinians hated God, and hated His words. Since, therefore, God is held in hatred, and Christ is made anathema by the Jews even to this present day, since the Holy Spirit who spoke in the prophets is held in hatred by the heretics, do you wish not to be held in hatred, but to be loved and blessed by all? See lest that sentence find you which says: "Woe when all men shall have blessed you". Nay rather, let us observe this only, that we too may say, that "they who hate me unjustly are multiplied". I wish, when I am held in hatred, that my conscience may know that I suffer hatred unjustly. The prophets too were held in hatred, but unjustly; Christ was held in hatred, but without cause. But if I am held in hatred for my sin, I cannot say that "they who hate me unjustly are multiplied". For I am justly held in hatred, if I am hated on account of my dishonorable and base acts. I cannot say that they hate me without cause. And would that we too might be able to say with such confidence, that "they who hate me unjustly are multiplied".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily07.html'
source_title="HOMILIES ON PSALMS 38, HOMILY II"
