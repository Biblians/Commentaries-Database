[[commentary]]
quote='''
After these things he admonishes concerning a vice by which almost all of us are troubled, and I know not whether anywhere anyone rare is found so perfect as to be without this disease. "Cease", he says, "from anger, and forsake indignation". There are many vices which are easily avoided by many. For example, the evil of unchastity. If anyone shall have devoted himself more earnestly to the labor of continence, he has cast off unchastity. Some have even subdued avarice, so that, although in other things they are not perfect, they seem nevertheless to avoid this evil, and some others as well. But the vice of wrath, hard and sharp, inflames and agitates even those who seem to be wise. Hence also Solomon says in the Proverbs: "Anger destroys even the prudent". That is, Do not, he says, wonder if wrath inflames the foolish, the evil, the unbelieving man, since frequently wrath agitates good and prudent men also. This sin, therefore, is also one of those which brings to the building wood, hay, and stubble, and it is necessary that materials of this kind, as it is written, be tried by fire, so that we remain in the fire so long, until there be consumed from us the wood of wrath, and the hay of indignation, and the stubble of words, namely of those which, agitated by vices of this kind, we have uttered. Therefore, for this reason, "cease from anger, and forsake indignation": that is, do not gratify your feelings when you have been stirred to wrath, but cease, forsake, despise. But we, when we receive these commandments, and on the contrary, when we have been stirred, cease not from wrath but from meekness, forsake not indignation but gentleness. But let us at least begin from this to amend ourselves, and gradually, softening wrath through continence and assiduous meditation, let us come even to this, that we no longer grow angry; and, blunting assiduously the assault of the indignation which is roused through fury, let us arrive even at this, that we be no longer troubled by the commotion of indignation. "Do not envy so as to do wickedly". Do not, he says, by provoking others to the rivalry of wickedness, become yourself also wicked; because the envy of evil ever strives to conquer another in malice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily02.html'
source_title="HOMILIES ON PSALMS 37, HOMILY II"
