[[commentary]]
quote='''
"But the meek shall inherit the earth". Against the Valentinians and the other heretics, who think that my Savior says in the Gospel things which are not in the ancient Writings, this verse is to be brought forward, just as we too have learned from a certain presbyter to bring these things forward for the convincing of them. For what was said in the Gospel: "Blessed are the meek, for they shall inherit the earth", see how it was already said before by the Holy Spirit through David: nay, Christ himself now says in the Gospels: "Blessed are the meek, for they shall possess the earth by inheritance". The Prophet indeed adds even something more than we read in the Gospel, saying: "And they shall delight in the multitude of peace". Here too the Greek uses that very word of which we spoke above also, κατατρυφήσουσιν, that is, they shall take delight rather than they shall be delighted. Therefore the meek shall take delight, or be delighted, in the multitude of peace. If there are any carnal men, they are delighted in foods which shall be destroyed together with their belly, just as the Apostle also says: "Foods for the belly, and the belly for foods, but God shall destroy both this and these". But the saints despise and disdain these delights too: but they have their delights in the multitude of peace. And the multitude of peace is said to be in the days of Christ. For thus it is written: "And there shall be a multitude of peace in his days, until the moon be taken away". Whoever, therefore, ceases from anger, and has forsaken indignation, and neither is his mind provoked to wrath, nor does he use wrathful speech, is wholly in peace, not only outwardly but also inwardly, and neither yields to one provoking him to wrath, nor himself provokes another to wrath, but has peace in himself, and in others, if perchance any are at variance, keeps to loving meekness, which is the most faithful guardian of peace, which governs all things. This man takes delight, or is delighted, in the multitude of peace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily02.html'
source_title="HOMILIES ON PSALMS 37, HOMILY II"
