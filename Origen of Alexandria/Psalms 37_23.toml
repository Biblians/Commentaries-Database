[[commentary]]
quote='''
"By the Lord", he says, "are the steps of a man directed". And elsewhere in this psalm he speaks of the steps of the righteous man in this way: "The law of his God is in his heart, and his steps shall not be supplanted". But also in the seventy-second psalm it is said: "My steps had almost been poured out". We therefore name "steps" (gressus) from "walking" (gradiendo), according to that which is written in Exodus, that Moses saw a flame of fire and an angel, when the bush indeed burned but was not consumed, and he said: "Stepping aside, or passing over, I will behold this great vision". From this passage, then, an occasion is given us for understanding the things we have in hand. Therefore concerning those things which we have recalled as written in Exodus — that is, "stepping aside I will behold this great vision" — I heard a certain one of the wise men before us saying, when he was explaining this passage, that it is not possible to see the great vision beforehand — that is, to gaze upon and to perceive the great mysteries — while one stands amid the converse and doings of this world; but that one must first pass over from these things, and transcend all worldly things, and our sense and mind must become free, and then arrive at the contemplation of great and spiritual things, and so at last see the great vision. This man, indeed, in explaining this passage, set forth what we have recalled above. But we, whose zeal it is, according to the admonitions of Scripture, to praise the words of the wise and to add to them, are able to add to what he said something of this kind. Everyone who journeys toward virtue advances by walking, so that little by little, through the many advances of the journey, he arrives at it. Journeying, then, and stepping as it were by certain paces, he always steps aside, and passes over the things he has unfolded, and leaving behind the things that are behind, he stretches himself out toward the things that are before. Stepping aside, then, he passes over the first place of malice, and thence advancing by paces and steps he passes over the other stakes of sins, then next the rugged crags of wickedness, and the slippery and precipitous places of the vices. But when he has escaped even these, always stretching himself out toward the things that are ahead, less of malice remains, and all that lies along the way of advance; if only in going he watches his steps more cautiously lest he slip, so that as he steps aside from each several place of malice, in such wise that he does not strike his foot against it, according to what is written in Exodus, he may be able to see the great vision. For no one who is still in malice, and does not step aside from it and pass over it, will be able to gaze upon this great vision of the secret things of God — that is, of His knowledge and wisdom. Great, then, is the vision, when God is seen with a pure heart. Great is the vision when with a pure heart the Word of God, and the Wisdom of God, who is His Christ, is acknowledged. Great is the vision, to acknowledge and to believe in the Holy Spirit. Great, then, is this vision — the knowledge of the Trinity. Nevertheless, even Moses was then seeing in Exodus the great vision, and he who was seen in the bush in the fire is called an angel, and he calls it a great vision. For he understood who it was in the angel. For immediately thereupon He says to God: "I am the God of Abraham, and the God of Isaac, and the God of Jacob". See, then, how great this vision is — although this very thing also is great, to know that God makes "His angels spirits, and His ministers a burning fire". And now indeed to Moses, still pasturing the flocks of Jethro his father-in-law, and stepping or passing over from these, this vision is great, in which an angel is said to appear to him. But if he shall also have passed over the Red Sea, and the pillar of cloud has covered him, and he has adored the sacraments of the future baptism, then he will be able to see a still greater vision. For he will enter into the darkness and the whirlwind, where God Himself is said to be, where it is written that Moses alone drew near to God, but the others stood afar off. And Moses advances so far through these great visions, that he says to God: "If I have found", he says, "grace before Thee, manifest Thyself to me, that I may evidently see Thee". And then he hears from God: "I will set thee in the cleft of the rock" — and the rock was Christ — that through a very small opening thou mayest see My hinder parts, that is, that thou mayest acknowledge those things which in the last times shall be fulfilled through the assumption of the flesh: "But My face thou shalt not be able to see". But having stepped aside through very many visions, let us now return to what we proposed concerning the psalm, that "by the Lord", he says, "are the steps of a man directed". We have expounded above how one enters upon the journey toward virtue: for he who journeys toward virtue has many things to step aside from and to pass over. Therefore you also who tend toward Christ, who is the Virtue of God, step aside from luxury, harlots, adulteries; step aside from thefts, false testimonies; then next step aside also from avarice, and every desire of money and of the other evil things; step aside from lying; step aside from the sorrow of the world. Unless you shall have stepped aside from all these, you will not be able to see that great vision of the Lord. There are, then, certain steps and feet in us by which we make this journey; there are steps of the inner man by which we can walk along that way which says: "I am the way, the truth, and the life". In making this journey, then, we must use many steps, that we may pass over all those things which we said above, because the steps of a man are directed by the Lord. For a man who wishes to travel this journey, the will of his own purpose alone does not suffice, unless the Lord also has directed his steps: because it frequently happens to travelers that they walk, yet cannot keep the way straight, but fall into certain errors — as those who are engaged in the learning of philosophy seem indeed to be traveling the way of virtue, but because their steps are not directed by the Lord, they do not keep the straight way. But heretics also, no less, enter upon the way even themselves, but since they understand the Scriptures carnally, not spiritually, they turn aside to the left. But if they do understand spiritually, yet in that very spiritual understanding do not hold the apostolic rule of truth, they fall no less, even they, to the right — the devil, so to speak, not directing their steps, but twisting them aside from the straight way. Let us therefore, turning aside neither to the right nor to the left, enter upon the middle way, which is Christ the Lord, because in Him the Lord directs the steps of those who walk. "By the Lord", then, "shall the steps of a man be directed, and he shall desire His way" — that way, namely, of which we spoke above. For he who is directed by God will desire Christ, and will long to abide always in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily04.html'
source_title="HOMILIES ON PSALMS 37, HOMILY IV"
