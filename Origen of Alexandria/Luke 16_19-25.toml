[[commentary]]
quote='''
But also to all the saints a contempt of corporeal delights is enjoined, and a hope of spiritual delights is promised in return. Do you wish also to receive authority of the divine Scripture concerning this? There was a certain rich man, and Lazarus a poor man; the rich man was in corporeal delights, Lazarus was wasted with hunger. Each departed from the age, and Lazarus indeed was taken up by the angels into the bosom of Abraham, that there he might rest in delights; but that one who had been in corporeal delights went off into the gehenna of fire, as it is in the Gospel, and hears from Abraham, that "you have obtained good things in your life", that is, you have abused delights, "and Lazarus evil things: but now here he rests, while you are tormented". No one can have delights both in the flesh and in the spirit. But if anyone takes delight in the flesh, like that rich man, he will lack the bosom of Abraham and its delights. But he who in the present age feeds on the bread of affliction, like that poor man, when he has departed hence, will be in delights.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily01.html'
source_title="HOMILIES ON PSALMS 37, HOMILY I"
