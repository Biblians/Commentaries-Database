[[commentary]]
quote='''
But if you wish also through examples to know how each one is bowed down by his sins, so that he cannot look up nor lift his eyes to heaven, gaze upon that publican who in the Gospel, having entered the temple and standing afar off, not daring to lift his eyes to heaven, but striking his breast and confessing his sins, said: "God, be merciful to me a sinner." To this man surely it is fitting to say, "I am bowed down even to the end, and I went about all the day saddened." And in saying this, he sets forth, as it were, the very disposition and soul of the penitent, who says: From the time I sinned, I have never laughed, I have never been glad, I have never indulged myself in anything of enjoyment, but I have always been in mourning, always in repentance, always in grief.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily06.html'
source_title="HOMILIES ON PSALMS 38, HOMILY I"
