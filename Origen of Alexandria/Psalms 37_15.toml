[[commentary]]
quote='''
But now let us see what happens to those sinners who do these things, that is, who use the sword of the devil and the darts of the malignant one, what the divine word says again about them: "Their framea", it says, "let it enter into their own heart, and let their bow be broken". Framea is a kind of dart, called by this name. Therefore those speeches, which, at the inspiration of the devil, the unjust and sinners bring forth, it says, against the righteous, to slay the upright of heart, will be turned back against those very ones who bring them forth, so that they may return thither whence they had proceeded. For just as it is said to the righteous and holy apostles by the Lord: "Into whatever house you enter, say: Peace to this house; and if there be there a son of peace, your peace will come upon him; but if not, your peace will return to you"; so here too, on the contrary, the sword of the impious which is drawn to slay the upright of heart is said to return upon themselves, and to be plunged into their own heart, and their bow to be broken, while the Lord delivers the righteous from their ambushes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily03.html'
source_title="HOMILIES ON PSALMS 37, HOMILY III"
