[[commentary]]
quote='''
After these things there are added certain matters which need no small exposition, for he says: "The sinner shall borrow and shall not repay, but the righteous shows mercy and lends". Even this, if we take it according to the letter, will not seem true. For many sinners indeed receive money on loan and repay it with interest, so that they themselves sometimes have even taken profit from the money which they had received. But here the Prophet defines, saying: "The sinner shall borrow, and shall not pay". But if you understand who it is that lends, and who it is that receives the loan, and inquire who is the sinner that does not repay the money which he received, you will understand that what is written has consistency. For example, when Paul teaches and hearers stand by him, Paul is he who lends the Lord's money, but the hearers are those who receive from his mouth the money of the word on loan. And if indeed he be righteous who receives the money from him, he will repay the loan whole and say: "Five minas you gave me, behold I have gained another five". If he is righteous, he says: "Five talents you gave me, behold you have ten"; or, "Two talents you gave me, behold you have four". But if he is a sinner, having received the word of God, he does not work out of it the works of the commandment, and does not repay the interest, but consumes all that he received on loan. Behold, even now all you to whom I speak these things, you receive on loan my words as money; this money is the Lord's. Or if you doubt, hear the Prophet saying, that "The eloquences of the Lord are chaste eloquences, silver tried by fire, purged of earth, sevenfold". If, therefore, I teach badly, my money is reprobate, according to those to whom it was said, "your silver is reprobate". But if I teach well, the money or silver is not mine, but is the Lord's, and it is tried. It is lawful for me, therefore, to lend the Lord's money, but my own proper money it is not lawful, because the word of the Lord forbids human money to be lent at interest. What, then, is the human, and what the Lord's money? I think that the speech of Valentinus is human money and reprobate, and the money of Marcion and of Basilides is human and reprobate, and the speech of all the heretics is not tried money, nor does it have in itself entire the figure of the Lord, but an adulterate one, which, so to speak, has been so figured outside the mint, because it has been composed outside the Church. But if you should see someone speaking forth not his own words, but the words of God, who may truly dare to say: "Do you seek a proof of Christ who speaks in me?", know that this man indeed lends, and lends not his own, but the Lord's money, and does that which is written: "All the day he shows mercy and lends", having authority to lend given to him by my very God Jesus Christ. For it is the Lord himself who, in the parable, when money has been given, says to the servants: "Go, do business until I return". And that servant who had scorned to multiply the money, he says, "You ought to have given my money to the money-changers, and I, coming, would certainly have exacted it with interest". This is the sinner who borrows and shall not pay: but the righteous repays the money received with interest, that is, he presents the received word of God together with works. You hear a discourse about chastity, you praise the teacher, you embrace the doctrine, you admire the teaching; through these you have received the money of chastity. And if indeed you are a sinner, having gone out from the Church you engage yourself in secular business, wantonness receives you, drunkenness follows, the faithless conversations of corrupt men, forgetting straightway all that you had received from the teacher, which you had praised, which you had admired, and you turn aside again to unchaste harlots, and you have become a sinner, who borrowed the word of chastity and do not repay the works of chastity. Likewise also, if you have heard the word of righteousness in the church, you have gone forth outside, there meets you a neighbor whose field you had coveted, and straightway forgetting the things that were said, that you may satisfy your desire, you invade what belongs to another, and thus, having borrowed the money of righteousness, you do not repay the interest, working the deeds of righteousness. So therefore, concerning each and every thing, "the sinner borrows and shall not pay, but the righteous shows mercy and lends". Not only, it says, does the righteous lend, that is, not only does he preach the word, that is, not only does he teach the unskilled, but he also has mercy on the weak. For he follows the example of the Lord who says: "I prefer mercy to sacrifice".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily03.html'
source_title="HOMILIES ON PSALMS 37, HOMILY III"
