[[commentary]]
quote='''
He who confesses to God for his sins, and grieves in spirit while he repents, knowing what punishment threatens the sinner after the departure from this life, speaks these words, setting forth how much he who turns himself to repentance and amendment must suffer, how his friends and neighbors abandon him and are made distant, because he himself has turned to the confession (exomologesis) of his sin and to mourning. He says, then: "My friends and my neighbors drew near against me and stood". Understand for me a man who is faithful, indeed, but nevertheless weak, who could even be overcome by some sin, and who on this account groans over his transgressions, and in every way seeks the care and healing of his wound; even though he has been caught off guard and has fallen, he still wills to recover his healing and salvation. If, then, a man of this kind, mindful of his transgression, confesses what he has committed, and with human embarrassment makes little of those who reproach him as he confesses, and who mark him or mock him — while he, understanding that through this pardon is granted to him, and that on the day of resurrection, in return for the things for which he is now put to shame before men, he will then escape shame and reproach before the angels of God — so that he is unwilling to cover and hide his stain, but proclaims his transgression, and does not wish to be a whitewashed tomb, which outwardly indeed appears beautiful to men, that is, so that to those who see him he may appear as though righteous, but within is filled with all uncleanness and the bones of the dead. If, then, there be someone so faithful that, if he is conscious of anything within himself, he comes forward into the midst and stands forth as his own accuser — but these who do not fear the coming judgment of God, hearing these things, are not weak with those who are weak, are not set aflame with those who are scandalized, do not lie prostrate with those who have fallen, but say: Keep yourself far from me, and do not approach me, for I am clean; and they begin to detest the one whom before they admired, and withdraw from the friendships of him who was unwilling to hide his transgression — concerning these, therefore, he who makes the exomologesis, that is, the confession, consequently says: "My friends and my neighbors drew near against me and stood, and my neighbors stood afar off". But he who desires to be saved after his transgression ought not to dread these things, nor to fear the reproach of those who indeed do not consider their own sins, nor are mindful of the divine Scripture which says: "Do not reproach a man who turns himself away from sin, but remember that we are all in faults". Let him not, therefore, think about such men, but let him think about his own soul, entreating God that he may be heard by Him and lifted up after his fall, so that he may also be able to say what follows: "For I will proclaim my iniquity, and I will take thought for my sin". Although my friends and my neighbors are set against me, and my kin make themselves distant from me, yet I become my own accuser, I confess my crimes with no one convicting me, I am unwilling to imitate those who, even when they are convicted in the courts, and are proved guilty by witnesses, and are even convicted by their torturers, nevertheless conceal their evils, and with them the shame of what they have committed prevails more than the pain of the torment. But I, who know that nothing is hidden from God, but that all things are naked and manifest in His sight — whatever I conceal, I hide what He knows — why do I not rather accuse myself, convict myself? Why do I await an accuser, when my accuser, my conscience, is with me? Perhaps in this way He too will spare me, if I do not spare myself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily07.html'
source_title="HOMILIES ON PSALMS 38, HOMILY II"
