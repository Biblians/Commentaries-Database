[[commentary]]
quote='''
"Because those who bless him shall inherit the earth; but those who curse him shall be exterminated". Those who bless him, that is, those who bless the righteous, shall inherit the earth. Which earth?—that good earth, that abundant earth, that earth flowing with milk and honey, where are those good things which are truly good; that they shall possess who bless the righteous, but those who curse him shall be exterminated. And to you it sometimes seems a small thing to speak evil of the saints, and it is very light for you to say of the servants of God, "That one is such and such, that one dissembles, and that one loves the world, but that one is an impostor"—do you not hear that those who curse the righteous shall be exterminated? Or if this seems small to you, hear elsewhere God saying to the righteous: "I will be an enemy to your enemies, and I will oppose your adversaries". You see how great a peril it is to be an enemy to the righteous, or to speak evil of the saints. For if we truly believe that which the Lord said of each one of his servants, that "I was hungry, and you did not give me to eat", and the things which he adds and says, that whoever did it to one of my least, did it to me, it is consequent that he say this too: You who cursed me, disparaged me, and spoke false things against me, and accused me. And if we shall say: Lord, when did we curse you, or when did we disparage you, or when did we speak false things against you? then he will say to us: "Amen I say to you, that what you did to one of my least, you did to me". For just as, giving to eat to one of these, you did it to me, and giving to drink to one of these, you gave to me, and just as, clothing one of these, you clothed me; so, cursing one of these, you cursed me, and if you blessed or honored one of these, you blessed me, and you honored me, as also elsewhere he nonetheless says: "He who receives you, receives me"; and: "He who spurns you, spurns me". Therefore let us restrain our tongue, and let us admire the servants of the Lord, and let us bless the righteous, and let us never disparage them, nor open our mouth to speak evil, lest perhaps we be exterminated, but let us bless, that we too may obtain a blessing through Christ our Lord, to whom be glory and power unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily03.html'
source_title="HOMILIES ON PSALMS 37, HOMILY III"
