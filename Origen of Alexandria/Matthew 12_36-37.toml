[[commentary]]
quote='''
Since the beginning of many sins is human speech, and our mouth serves many evils, and it is very difficult to find a man who, for even one hour at least, keeps his mouth and his tongue from sin, he says: "I said: I will keep my ways, that I sin not with my tongue". "For by thy words", he says, "thou shalt be justified, and by thy words thou shalt be condemned". And again: "Amen I say to you, for every idle word you shall render an account in the day of judgment". Not only, he says, for that which you have spoken ill, but for what you have spoken idly, because an evil word is not idle, for it works an evil work. But an idle word is one that does neither anything good nor anything evil. If therefore in the day of judgment we shall render an account not only for evil words, but even for idle ones, who shall boast that he has a chaste heart? Or who is confident in saying: I am clean from sin?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily08.html'
source_title="HOMILIES ON PSALMS 39, HOMILY I"
