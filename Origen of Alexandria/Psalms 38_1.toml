[[commentary]]
quote='''
God, the Creator of human bodies, knew that the frailty of the human body would be such as could contract various sicknesses and would be liable to wounds and other infirmities; and therefore, providing beforehand for the sufferings to come, he also brought forth medicines out of the earth and handed down the discipline of medicine, so that if sickness should befall the body, healing would not be lacking. To what does this preface tend for us? Without doubt it is drawn back to the soul: since when the Creator of all had also fashioned the soul itself, he knew that it would be capable of vices, and on this account subject to sins and burdened by them. And therefore, just as he prepared medicines for the body from herbs compounded by art and discipline, so also he prepared medicines for the soul in those words which he sowed and scattered throughout the divine Scriptures: so that those who have been oppressed by some sickness, as soon as they feel the force of the disease and perceive the sting and pain of some wound — that is, when they see the soul bearing something contrary to its nature — may seek a fitting and suitable reasonable discipline which can heal them from the precepts of God. For he handed down also the industry of the medical art, whose chief physician is the Savior, who says of himself that "They that are whole have no need of a physician, but they that are sick." And he indeed was the chief physician who could cure every ailment and every infirmity; but his disciples Peter and Paul, and the prophets too, are physicians, and all those who after the apostles have been set in the Church, to whom the discipline of healing wounds has been entrusted, whom God willed to be physicians of souls in his Church, because our God does not will the death of the sinner, but awaits his repentance and his prayer. Next, this very psalm which has now been read shows us how, if perhaps we are at some time overtaken in sins, we ought to pray, and with what disposition, and to entreat the physician for our pains or infirmities. Whenever, then, the enemy has overtaken us and has wounded our soul with his fiery darts, this psalm first teaches us this: that after sin it is fitting to confess the sin, and to call the fault back to memory, so that through the remembrance of the fault the heart, goaded and stirred up over its own offense, may for the time restrain and recall itself, lest it commit anything of the kind again; and for this reason I think the psalm itself is inscribed, "A psalm of David, for remembrance." And what "for remembrance" means, it recounts through the whole body of the psalm itself. Let us all, therefore, who are sinners, see, if we have been found in some offense, what we ought to say or what we ought to do, so that, when we have learned these things in Sacred Scripture, we may also merit to obtain the healing of our wound. It would indeed have been good, so to speak, for the body of our soul always to continue in health, and, encompassed by the arms of God, to remain invulnerable against all the fiery darts of the malignant devil, to experience nothing of any ailment, nothing of any sickness, and for our inner man to take on nothing of vice or disease. But if through its own negligence and the sloth of the mind it has fallen into sin, let it recognize what follows upon this. To be reproved or corrected is a penalty of pain, a torment, and so grievous is it that even those who seem faithful and religious, if perhaps as men they have at some time fallen into some offense and are reproved, grow indignant against those who reprove them, and hate them. For they correct in order to amend. And this evil was the cause why even among the former people the prophets were held in hatred and were harassed with persecutions. This was the cause that had Isaiah sawn asunder, that forced Zechariah to be slaughtered between the temple and the altar, that had Jeremiah plunged into a pit of mire. And last of all, this was the cause that drove our Lord Jesus Christ to the cross. For all the crimes and outrages which we have enumerated above were committed for no other cause than that, while all men are unwilling to be cut back through the correction of the delinquent in the medicinal discipline, the people, impatient of the cure and of the remedy, blazed up to the destruction of the one healing them. Blessed, therefore, are those who are already called wise by Scripture itself, who, when they have offended, if they are reproved, do not hate those who reprove. For Scripture says thus: "Do not reprove the wicked, lest they hate you; reprove the wise man, and he will love you." Do you see how Scripture has called wise the man who is liable to correction, yet does not hate but rather loves the one who reproves? Such were those who were reproved by the Apostle, and, being refuted, did not hate those who reproved. Hence I too judge that the man in Corinth who had most grievously offended obtained mercy for this reason: that, having been corrected by the Apostle — and so bitterly corrected that he was cut off from the assembly of the Church — he nevertheless did not hold the one reproving him in hatred, but received the punishment patiently and bore it bravely. I judge that he even conceived a greater affection toward Paul, and toward all who had obeyed Paul's ordinances in his punishment. Hence Paul too revokes the sentence, and joins the one cast out back to the Church, and adds, saying: "Confirm your charity toward him." For he saw that after the punishment the man had preserved his charity; and therefore he said this so that, even after the sin, charity should not so much be bestowed upon him — for it was already present — but that the charity which was present should be confirmed by all. It is necessary, then, that he who sins be reproved: but since this correction, however useful it is, is grievous to us who are weaker, we avoid bearing it in the presence of all. And why do I say in the presence of all? Sometimes, when we are reproved, we do not even endure two witnesses to be present, but we blame the one reproving and say: You ought to have said what you wished to me alone, and not to have brought a blush upon me in the presence of many. We grieve, we are thrown into turmoil, we boil over, and we are tormented in the inner feelings of the soul. But if such is the correction by which we are reproved by men or in the presence of men, what shall we do if God reproves us, if God himself refutes and reproves us in wrath? We who cannot bear the anger of a reproving bishop, but receive it with indignation — how shall we endure that wrath which is said to be God's, reproving us? Knowing, therefore, that there are very many differences of reproving, and wishing, as a man, indeed to be reproved for his offenses, but fearing lest he be reproved with a heavier weight — that is, lest he be reproved in the wrath of the Lord — the Prophet says here also, just as he had said before in another psalm as well: "O Lord, rebuke me not in your wrath." And similarly he says what follows: "neither correct me in your anger." We ought, then, to say something also about correction, concerning which the Apostle teaches us generally, saying: "Every correction indeed for the present seems not to be of joy, but of sorrow; but afterward it will yield the most peaceable fruit of righteousness to those who have been exercised by it." And observe even children, how, when they are corrected with blows by their tutors, or are roused by their teachers, they take it grievously indeed, and judge that pain to be the greatest evil which is inflicted upon them for the sake of instruction; and although they are not ignorant that their advancement lies in instructions and corrections of this kind, nevertheless they bear it grievously and impatiently. But if the instruction of children is of this kind, what ought we to think about ourselves who are old, what sort of instruction or correction do we reckon to be hanging over us — one that is inflicted neither by stewards nor by tutors? For Scripture indeed knows the tutor and the steward and the guardian of a little child: what, I say, ought we to suppose or feel, when our instruction and correction has been carried out by the Father of the household himself? Let us return again to the likeness of children. If a child is corrected by his tutor, it will not be necessary for him to know the correction of paternal severity, which is provoked by graver offenses and outrages. If a child is corrected by his teacher, the master will not be so severe as a father can be, if he has come to know grave offenses in his son. For if a father corrects for greater and graver sins — let the son's deed be so great that it has stirred the father to anger — without doubt, after tortures, after punishments, even the penalty of disinheritance is to be feared. If you have understood the likeness, pass over for me from the example to the reality, and understand about all of us the things that are said. All bishops and all presbyters and deacons instruct us, and in instructing they apply corrections and rebuke us with rather severe words. But there are times when we are instructed also by guardians and agents — that is, by those angels to whom the dispensing and governing of our soul has been entrusted: as there is described in a certain place the angel of repentance, who takes us up to be chastened, as the Shepherd sets forth, if indeed that little book seems to anyone worthy of acceptance. Meanwhile we men undergo various instructions that chasten us and correct us; yet we are not yet chastened by the Father of the household himself, but by the guardian angels, who are allotted the office of chastening and amending each one of us; and it is more bearable when we are corrected by one of these. So too at times our correction has been entrusted even to a tutor. For all who were under the law, since the law was our tutor in Christ, when they offended in the law were corrected by the tutor, when they were punished according to the law. For they were punished either when they were stoned, or when they suffered something of those things which Moses had written. None, therefore, of those of whom we spoke above was punished by the Father of the household himself. For the law was not the Father of the household, nor was the angel of repentance. But there are other sins for which the Father of the household himself punishes the sinner — namely him who, having overstepped the measure of his crimes, has stretched out beyond an affront to the creature to the impiety of his own wickedness. And yet no one but God alone knows who ought to be handed over to the guardians to be chastened, and when; or who is to be corrected by the agents; and when even one is to be subjected to the tutor, whose corrections are also lower than all of these — if indeed anyone is such as to provoke, so to speak, the very divine hand itself against himself for his own vengeance. If you have understood the things that have been said, if you have followed the deeper understanding, look now at how the Prophet pursues these things, when he says: Even if you correct me, O God, do not correct me in anger. But we neither wish to be corrected, nor do we endure the tutor admonishing us, nor do we willingly receive the corrections of the guardians or the agents; and therefore it is necessary that correction be brought upon us from the very wrath of God. For the Prophet says: "O Lord, rebuke me not in your wrath, neither correct me in your anger."
'''
