[[commentary]]
quote='''
"When he shall have fallen", he says, "he shall not be troubled". Having above said that his steps are directed by the Lord, here he speaks of his fall. See, then, that even to those who travel this journey it sometimes happens to fall, even to those who are directed by the Lord; but there is a great difference between the fall of the righteous and the fall of the unrighteous. The righteous man, he says, when he shall have fallen, is not laid prostrate; the unrighteous man, and he who has no hope placed in God, if he shall have fallen, is laid prostrate and does not rise — that is, if he has sinned, he does not repent and knows not how to amend his sin. But the righteous man, if he has offended in anything, if in a word — for it is the Apostle who says: "For in many things we all offend, and if any man offend not in word, this is a perfect man" — the righteous man therefore offends in word, perhaps also sometimes even in deed, but he knows how to amend, he knows how to correct: he knows how, who had said, "I know not the man", and a little after, when he had been looked upon by the Lord, to weep most bitterly; he knows how, too, who had seen the woman from the roof and had desired her, to say "I have sinned", because "against Thee only have I sinned and done evil before Thee". If, then, when the righteous man shall have fallen he is not laid prostrate, he will not remain in sin, but will leap forth quickly, like a roe from the nets, and like a bird from the snare. But the unrighteous man not only remains, but is even laid prostrate in his sins. But the righteous man, what does he do? "The law of his God is in his heart, and his steps shall not be supplanted". There he said that the steps of a man are directed by the Lord; here, that the steps of the righteous shall not be supplanted, "because the Lord", he says, "strengthens his hand". In another psalm, that is, in the seventy-second, he says: "But my feet were almost moved". In the same sense it seems to be understood likewise. For as we advance toward the virtues we use, as it were, a certain ascent; and in that ascent, if anyone slip and fall down, he loses the gain of his ascent. This man's steps, then, are poured out. But this happens when someone, after sin, has turned backward: as befell Lot's wife, who was entering in well as she went out from Sodom, and, fleeing the punishments of the wicked, was entering and ascending toward the mountain whither she was proceeding with the angel as guide; but because, against the commandment of God — that she had been ordered not to look back, nor to stand in all that region, but to ascend to the mountain and there be saved — when she, turned toward what was behind, looked back, there her steps were poured out, she lost all that she had before stepped aside from, and remained a completed little statue of salt. This is what the Lord says in the Gospel: "No one putting his hand to the plow and looking back is fit for the kingdom of God". Do you wish me to show you also others whose steps were poured out? Recall those who passed through the Red Sea as through dry land, and, sinning in the desert, fell, and there their steps were poured out. But also now, if it should ever happen that someone has lived in continence for three or four years, and even longer, another has given his labor to the study of the word and of doctrine and to the labors of wisdom; then afterward, if this one is overcome, and either passes over to the luxury of the flesh, or turns aside to other sins, or transfers himself to the life of the world, or turns to the business and gains of corruptible life — do not hesitate to say of him that his steps have been poured out. Let us therefore beseech the Lord that He direct our steps, and guard our ways, so that our steps be not supplanted; that in the way we travel — that is, in Christ our Lord — our footsteps may be made firm as upon a stable rock, that we may in no way be able to be supplanted; through Him, namely, whose head we watch over, and He watches over our heel — to whom indeed we ought never to offer the bare sole, but we ought always to be "shod as to our feet in the preparation of the Gospel of peace", so that if the devil the supplanter comes, and finds our feet fortified and standing upon the rock, he may not be strong enough to supplant us thence. For although we said a little before that some fall and some slips can happen even to those who follow the way of virtue, yet it must be observed that there, where he said, "When he shall have fallen, he shall not be laid prostrate", above he had spoken not so much of the righteous man as of the pure man. For he says: "By the Lord shall the steps of a man be directed, and he shall desire His way; when he shall have fallen, he shall not be laid prostrate". In this it is shown that there are some falls which nevertheless do not straightway indicate that he who has fallen is overcome and laid prostrate. For as it is wont to happen also in a contest, that of two wrestling together it befalls one to fall first, and, when he has fallen, to rise and to conquer: so also in our contest, which is for us against the prince of this world, if it perchance happens that one of us is overcome and falls into some sin, it is possible that after the sin someone should come to his senses, and rise up and shudder at the evil he has committed, and thereafter not only contain himself, but also make satisfaction to God, washing his bed every night, and watering his couch with tears, taking up the word of prophetic authority by which it is said: "Shall he that falls not add that he may rise again? or he that has turned away, shall he not turn back? Woe to those who have turned away with a shameless turning away", says the Lord. And this is he who was indeed able to fall, but could not be laid prostrate. But if you shall see someone fallen into some sin, and after the fall despairing of conversion, and saying: How now can I be saved, who have fallen? now there is no hope, my sins bind me up, how can I dare to draw near to the Lord? How to return to the Church? — and if with this despair such a one departs even from God, this man has not only fallen, but in his fall is laid prostrate and sunk down. And it is indeed to be wished that the athlete of piety and virtue should remain always immovable, so that he lose not even one bout, so to speak, that he be not once bent or supplanted. But if this cannot be, but it should befall him to fall, let him not lie down after the fall, lest he be laid prostrate, but let him rise up and amend his fault, let him purge by the satisfaction of his repentance what he has committed, lest even of him the Apostle should say: "And I should mourn many of those who sinned before, and did not do penance for the uncleanness and fornication and unchastity which they committed". Wherefore also the Apostle took up examples of the wrestling contest when he says: "No one is crowned unless he has striven lawfully", except that he wished us to know the strivings and contests of the law? — who also of himself says: "So I fight, not as one beating the air". And again: "I have fought the good fight". Since, then, a striving and contest is set before us, we ought also to know the contest of the law. There are athletes who conquer in all contests, and in all are crowned. Among the boys (paedas) they conquer, among the youths (agonios) they conquer, among the men (andras) they conquer. Others are conquered among the men, but are crowned among the youths, and sometimes conquer even among the men. Therefore some are crowned always, some a second or third time. Surely it is a wretched thing and of the utmost unhappiness, in all the contests, so various and diverse, not to merit even one crown. So therefore also the Christian, whose "striving is not against flesh and blood, but against principalities and powers, and against the princes of this world of these darknesses, against the spiritual things of wickedness in the heavenly places", since he has adversaries so many and such, ought like a contestant to be watchful, if it can be, that he may always conquer as often as he engages, and straightway among the boys (paedas) — that is, among the children — seize the first crowns. Do you wish me to show you some who among the children — that is, straightway at the first milk — were crowned? Look upon the blessed Daniel, who from a boy merited both the grace of prophecy, and, convicting the wicked elders, as a boy obtained the crown of righteousness and chastity. Do you wish me to bring forth for you another crowned among the children? See Jeremiah, who, when he excused himself from prophesying on account of his youth, heard from the Lord: "Say not, I am a boy, for to all to whomsoever I shall send thee, thou shalt go, and whatsoever I shall say to thee, thou shalt speak". But perhaps these ages seem to you already adult. I will give you an athlete who wrestled and conquered before he uttered his infant cries among men. Jacob, while still within the womb of his mother, wrestling with his brother Esau, supplanted him and conquered, whence also he received from his parent the blessings of the firstborn belonging to the supplanted and vanquished brother. For do not those children too seem to you to have been crowned in a childish contest, who at Bethlehem, of two years old and under, for the name of the Lord took the palm of martyrdom? You see how many examples of crowns among children we have. This concerning that of which we resumed the exposition — that verse which says: "When he shall have fallen, he shall not be laid prostrate". And why he is not laid prostrate, he added the cause, saying: "Because the Lord strengthens his hand". And see how consistently he speaks of each thing: Lest he fall, the Lord, he says, directs his steps; but if he shall have fallen, he is not laid prostrate: the Lord, he says, strengthens his hand. You see, then, that we always need the Lord's help. First, that we not fall; then next, even if we shall have fallen, that we may rise again.
'''
