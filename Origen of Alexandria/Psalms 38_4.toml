[[commentary]]
quote='''
Let him also add these things who repents for his sins, and let him say: "For my iniquities have risen above my head; like a heavy burden they have been made heavy upon me." For those who neither grieve nor are burdened for their sins, but are secure and float about in delights, cannot say these things, nor do they feel that their iniquities indeed grow and go beyond the height of their own head, while they themselves shrink and are reduced to nothing; and therefore they cannot say: "For my iniquities have risen above my head; like a heavy burden they have been made heavy upon me." For how can those say it who not only take delight in their offenses, but even, exulting, parade their evils? — for whom indeed their sin becomes not a burden, but a pleasure. It is not for those, then, to say these things, but for those to whom lust has already become foul, to whom vices have become horrible, by whom at last all the pleasure of present gratifications has been discovered to be worth nothing, since afterward it will be altogether nothing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily06.html'
source_title="HOMILIES ON PSALMS 38, HOMILY I"
