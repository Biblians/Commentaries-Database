[[commentary]]
quote='''
Such were those who were reproved by the Apostle, and, being refuted, did not hate those who reproved. Hence I too judge that the man in Corinth who had most grievously offended obtained mercy for this reason: that, having been corrected by the Apostle — and so bitterly corrected that he was cut off from the assembly of the Church — he nevertheless did not hold the one reproving him in hatred, but received the punishment patiently and bore it bravely. I judge that he even conceived a greater affection toward Paul, and toward all who had obeyed Paul's ordinances in his punishment. Hence Paul too revokes the sentence, and joins the one cast out back to the Church, and adds, saying: "Confirm your charity toward him." For he saw that after the punishment the man had preserved his charity; and therefore he said this so that, even after the sin, charity should not so much be bestowed upon him — for it was already present — but that the charity which was present should be confirmed by all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily06.html'
source_title="HOMILIES ON PSALMS 38, HOMILY I"
