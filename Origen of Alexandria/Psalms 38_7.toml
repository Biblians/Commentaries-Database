[[commentary]]
quote='''
"All the day I went about saddened, for my loins are filled with illusions." In the loins or in the reins the receptacle of human seed is said to be; whereby that kind of sin is indicated which is carried out through lust. For its work is that thing which the Apostle designated among the foremost sacrileges, saying: "Shall I then take the members of Christ and make them the members of a harlot? God forbid!" When, therefore, one flows more inclinedly and incontinently into wantonness of this kind, then his loins, or reins, are asserted to be filled with illusions. For it is an illusion of the devil deluding a man and provoking the incontinence of this kind of sin. It is no wonder, then, if the loins of sinful men are filled with illusions, since Job too speaks thus of the dragon, who is understood to be the devil: "All his strength is in the loins, and his power in the navel of his belly." The strength of the devil, then, is chiefly about the loins of man, whence fornication and adulteries proceed, whence the corruption of boys, whence all filth is generated. So too, indeed, the fault of women is about the navel of the belly, which he wished to indicate by a more decent expression, in both of which he designates the strength and power of the dragon, the devil, to be. "And there is no health in my flesh." In this he shows his advancement, and indicates that he is near to the mortification of the flesh and its destruction. For this reason he here repeats this a second time, so as to declare that a remedy has already been applied to the troubles of temptations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily06.html'
source_title="HOMILIES ON PSALMS 38, HOMILY I"
