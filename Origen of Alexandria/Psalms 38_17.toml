[[commentary]]
quote='''
"For I am ready for scourges". This too is the voice of a good and, so to speak, excellent sinner, who has indeed transgressed, yet awaits the scourges of his transgressions, by which he wishes to be amended in the present, lest he be punished and perish in the future. Set before your eyes a sinner saying to the Lord: I, because I have sinned, am even now ready for scourges; do not reserve me for eternal fire, do not reserve me for the outer darkness. While I am in this life, requite me for my sins, since You scourge every son whom You receive. I beseech You, scourge me too, and do not reserve me with those who are not scourged, who "are not in the labors of men, and shall not be scourged with men", that is, who are utterly forsaken by You, whose amendment and correction You do not seek. Knowing, therefore, what difference there is when a sinner is scourged by Him who "scourges every son whom He receives", and what difference there is in him who is not held worthy of scourges, he says to the Lord: I am ready for scourges, that is, if You will bring illnesses upon me, send sicknesses, I shall bear it tolerably: I know that I am worthy that not only through sicknesses my sins be loosed, but I desire to be purged through all afflictions, only that I be not reserved for eternal punishments and torments. If it please You to inflict losses, I endure it; if it please You that all my possessions perish, let them utterly perish, only that my soul perish not before You. If through the death of my dear ones and kin You will to purge me, let them too die, that they too may be freed from bonds of this kind; let my children be taken away, while they are yet boys, and, placed in tender years, are not yet stained with the graver filth of sins. With all scourges, therefore, I am ready to be amended and beaten, and I refuse none of these things, only that I may flee the punishments of eternal fire. "I, therefore, am ready for scourges, and my sorrow is ever before me". I have my sorrow before my eyes, that I may be able to compensate for the coming sorrows of punishments by present sorrows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily07.html'
source_title="HOMILIES ON PSALMS 38, HOMILY II"
