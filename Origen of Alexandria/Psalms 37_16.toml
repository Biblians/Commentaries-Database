[[commentary]]
quote='''
"Better is a little to the righteous than the many riches of sinners". According to the letter, this is straightway a useful admonition even for any of the simpler sort, of which it must be spoken first, although it has also something deeper, which, if anyone is able to grasp it, let him grasp it. What, then, the letter teaches us, let us see. In this world both the righteous and the unjust bear the common solicitude of life, that they may have the things necessary for sustenance. But the righteous indeed are not so inclined toward solicitude for sustenance as they earnestly bear the care of righteousness, so that even if the things necessary for sustenance are to be sought by them, they are sought without injustice, so that their very gain, which is necessary for daily use, is made with all righteousness. But the unjust care nothing about righteousness, but expend all their care on this: how they may acquire; in this is all their zeal, to seize gains in whatever way and of whatever sort: they do not consider whether they acquire well, whether with righteousness: they are not solicitous that at the judgment of Christ their possessions may be found to have been sought with righteousness. How can those do these things, who join field to field, and bring farm near to farm, that they may take something from their neighbor? Since therefore one of two things must necessarily be done, that is, either to acquire much with injustice, or a little with righteousness, "Better is", it says, "a little to the righteous, than the many riches of sinners". And truly, as by some special title, many riches are reckoned as being in iniquity. Whence I too judge that our Lord and Savior pronounced the Mammon of iniquity to be, as it were, truly a god and lord, when he says: "Make for yourselves friends of the unrighteous Mammon". These things according to the letter. Let us now see whether the word contains anything secret as well. There are many and diverse studies of letters in this world, so that you may see very many, beginning with the grammarians, learning by heart the poems of the poets, and the fables of the comedies, the fictitious or laudatory narrations of the tragedies, the long and diverse volumes of histories, then afterward passing on to rhetoric, and there seeking every dye of eloquence, after these coming to philosophy, examining dialectic, inquiring into the knots of syllogisms, testing the measures of geometry, scrutinizing the laws of the constellations and the courses of the stars, and not omitting music either; and thus, having been instructed through all these so diverse and various disciplines, in which they have learned nothing of the will of God, they have gathered riches, many indeed, but riches of sinners. But you may see one from the Church, unskilled indeed in word and in erudition, but filled with faith and the fear of God, who, because of the fear of God, dares in nothing to transgress, but altogether fears to open his mouth, lest perhaps an evil word proceed from his mouth, and takes care not to transgress even in the least matters, in which that man who is rich in the wisdom of this world cannot take care of himself. Comparing these, therefore, with each other, the divine word says: "Better is a little to the righteous, than the many riches of sinners". As are the riches of sinners, the wisdom of this world, in which they are rich and abounding in eloquence, nor yet are they able through these to restrain themselves from sin. But the little of the righteous is that of him who has faith like a mustard seed, little, but living and vehement, through which he strengthens and restrains himself from sin. Better, therefore, is this little of the faith of the righteous than the many riches of sinners, which they have in the eloquence and wisdom of this age, which is destroyed. Yet if anyone were able both to have riches, and not to have the riches of sinners; but to gather some things from the treasures of Moses the lawgiver, to acquire others also from the wealth of the prophets, from Isaiah, from Jeremiah, from Ezekiel, to examine also the secrets of Daniel, and to penetrate the hidden and obscure treasures of the rest of the prophets; this man is now not compared with the wise of this world, so as to be called better than they, but is rather set on a level with those who were saying, "that you have been made rich in all word and in all knowledge"; and who, destroying the wisdom of this world, and having become as it were its conquerors, say that they are ready to take captive every understanding that exalts and raises itself against the knowledge of Christ. Even if indeed he be the one whom we spoke of above, unskilled and an idiot, but faithful and fearing God, "better is that little" of faith to this "righteous man than the many riches of sinners", which they have gathered along with the wisdom of this age. But above both of these is he who is rich in the word of God and the knowledge of the truth, that is, who, according to Paul, is rich in all word and in all knowledge, and is nonetheless rich in good works. But if you wish to know what it is to be rich in all word, I will teach you briefly. Begin to examine from the first word of Genesis, thence in the word of Exodus, after these in the word of Leviticus, in Numbers, in Deuteronomy; grow rich from Joshua the son of Nun, grow rich from all the judges together, and thence onward, in sequence, from each and every of the books of divine Scripture, until you arrive at the evangelical and apostolic riches. For, by way of example, if anyone should give his labor to the one word of the Psalms, and when he wishes sing the whole psalter, he is rich indeed, but not in all word and all knowledge, but is rich in the word of the Psalter alone. Or if anyone give his zeal to the evangelical and apostolic reading, and exercise himself in the commandments of the New Testament, this man too is rich, but not in all word, except only the evangelical and apostolic. But if he were able to learn thoroughly the New and the Old Testament with equal zeal, and to be instructed out of all its erudition, so that he be ready to give an account of each and every of the things that are written, and to fit his life according to the word of the truth which is contained in the Scriptures; this man indeed is rich in all word and in every good work. And these, I think, are the riches of which it is said: "The redemption of a man's soul is his own riches". "Better", therefore, "is a little to the righteous than the many riches of sinners".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily03.html'
source_title="HOMILIES ON PSALMS 37, HOMILY III"
