[[commentary]]
quote='''
Since the commandment enjoins, saying, "Be subject to the Lord", it seems necessary to examine what it is to be subject to the Lord, and what it is not to be subject. For just as "not everyone who says, Lord, Lord, shall enter into the kingdom of heaven, but he who does the will of my Father who is in heaven", so not everyone who says that he is subject to the Lord is subject to him, but he who is in fact subject to him; because that one is truly subject to the Lord whom not the word of profession but the work of subjection shows to be so. And what we say is more fully understood in this way: Our Lord Jesus Christ is righteousness. Therefore no one who acts unrighteously is subject to Christ, who is righteousness. Christ is truth. No liar is subject to Christ, who is truth, whether he speaks falsehood in deeds or in doctrine. The Lord Jesus Christ is sanctification. No one is subject to sanctification while he is defiled and impure. The Lord Jesus Christ is peace. No one contentious and turbulent is subject to Christ, who is peace, but that one is subject to him who says: "With those who hated peace, I was peaceable". Hence also in another psalm the Prophet says to his own soul: "Nevertheless be subject to God, O my soul, for from him is my patience". But the Apostle too signifies things great and mystical concerning subjection when he says: "But when all things shall be made subject to him, then shall the Son himself also be made subject to him who subjected all things to himself". Hear then what he says, that it is necessary that all things be subject to Christ, and that then he himself is subject, by that subjection, namely, which it is fitting to understand of the spirit. Meanwhile it is necessary that all things be subject to Christ, so that then at last, when all things are fulfilled and made perfect through subjection, he himself, as it were bearing back this palm of his victory to the Father, is said to be about to be made subject. And unless this be understood mystically, it is believed without doubt to indicate something impious to those who do not attend. For it is not to be supposed that the Son of God is now indeed in no way subject to the Father, but that in the last times, when all things shall have been made subject to him, then he too shall be made subject; but rather, because he takes up into himself all that is ours, and says that it is he who hungers in us, and he who thirsts in us, and is naked and sick, and a guest and thrust into prison, and testifies that whatever has been done to one of his least ones has been done to himself; consequently and deservedly, when each one of us is fully and perfectly made subject to God, so that in nothing at all does he show himself disobedient, he protests that he himself is made subject. But in yet another way what we say is more fully understood. If we suffer pain in some member of the body, although our soul be sound, and all our remaining members be healthy, nevertheless, because by the pain of one member the whole man is afflicted, we do not say that we are well, but that we are ill. For example, we say: That man is not well. Why? Because his feet pain him, or his loins, or his stomach. And no one says that he is well if his stomach pains him, but he is not well because his stomach pains him. If you have understood the example, let us now return to what was proposed. The Apostle says that we are the body of Christ, and members in part. Christ, therefore, whose body is the whole race of men — nay, perhaps the whole universe of all creation — and each one of us is a member in part: if some one of us who are called his members is sick, and labors under some disease of sin, that is, if he is branded with the stain of some sin, and is not subject to God, rightly is that one said not yet to be subject, whose members are those who are not subject to God. But when he shall have all those who are called his body and members sound, so that they have labored under no disease of disobedience, all the members being sound and subject to God, deservedly does he say that he is subject to him, we, his members, obeying God in all things. But if you wish to examine yourself, and to see whether you are already subject to God, or whether you still remain disobedient, sift yourself in this way: If there is nothing contrary to God in you, you are subject to him. And we speak of what is contrary in this manner: God is charity; if there is no hatred in you, you have not that which is contrary to God. God is truth; see that there be not in you falsehood, which is contrary to truth. For if there is falsehood in you, you are not subject to God, but to him who is the father of falsehood. And if there is unrighteousness in you, you are subject to the father of unrighteousness rather than to God, who is righteousness. If you shall detect in yourself the remaining vices also, know that so long you are subject not to God but to the devil. For it is certain that in the time of fornication we are subject to the spirit of fornication, being opposed to the spirit of chastity. And in the time of wrath, or of fury, we obey the spirit of anger, resisting the spirit of meekness. Therefore, seeing that our whole life bears a certain contest of obedience, whether to Christ or to those who are contrary to Christ, let us strive, through the religious discipline of prayer and of instruction, so to act that we may never be found obeying the devil or his malice, but that our every act, and every word, and every thought may be found in subjection to Christ. But if perchance you say, What does it profit if I am now subject, when I have already sinned before and been overtaken in offenses? — without doubt, when we offended, we were not subject to God, but when we ceased from offenses, then we received the beginning of subjection. When, therefore, subject to the fear of God, we cease to sin, then also we receive confidence to ask pardon for our former offenses. But so long as we remain in offenses, in vain do we ask pardon for our offenses. Hence I remember that I have frequently said to you that we worthily ask pardon of our offenses when, placed far from sin, we can say that word: "Remember not our old iniquities". He did not say those which we do, but those which we did at some time. Be subject, therefore, to the Lord, and being subject, do not sin. Then beseech him for your past and old offenses.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily02.html'
source_title="HOMILIES ON PSALMS 37, HOMILY II"


[[commentary]]
quote='''
"Do not envy him who prospers in his way, in the man who works iniquity". He describes those things which befall men. For frequently, if we see the unrighteous man in prosperous successes, and placed in that happiness of life which they lead, we are scandalized, and we incur peril of faith, and in our heart we complain against divine Providence, saying: What does it profit to act righteously? Behold, the righteous are afflicted, here the unrighteous man acts prosperously. He is unrighteous, and he arrives at the highest riches, he ascends to the lofty summit of honors and powers; perhaps it is better to be unrighteous than righteous. These things weak and frail souls, even if they do not utter them with the mouth, nevertheless speak in their heart, when they have seen the unrighteous acting in prosperous successes in their way. And therefore the healing of this commandment comes to our aid, that, when we have seen these things, we may not envy, that is, that we may not provoke the Lord against ourselves by speaking such things in our hearts: but we ought to reflect that the present age belongs to those who have no hope of future blessedness. And therefore let us patiently bear that they act in these prosperous successes, that they receive their good things in their life, until that also which is ours may come, to which we have been invited, and whose good things have been promised to us, upon which we look, into which we hope, whose good things do not pass away like a shadow as in this age, but remain forever. But it is impossible both to obtain good things in the present age and in the future. For it is necessary that it be said to one, that you have obtained good things in your life; and to another, that you have obtained evil things; and that the one receive good things for evil, and the other evil things for good, as those two are an example, the rich man and Lazarus. Therefore: "Do not envy him who prospers in his way, in the man who works iniquity".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily02.html'
source_title="HOMILIES ON PSALMS 37, HOMILY II"
