[[commentary]]
quote='''
It is no wonder, then, if the loins of sinful men are filled with illusions, since Job too speaks thus of the dragon, who is understood to be the devil: "All his strength is in the loins, and his power in the navel of his belly." The strength of the devil, then, is chiefly about the loins of man, whence fornication and adulteries proceed, whence the corruption of boys, whence all filth is generated. So too, indeed, the fault of women is about the navel of the belly, which he wished to indicate by a more decent expression, in both of which he designates the strength and power of the dragon, the devil, to be.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily06.html'
source_title="HOMILIES ON PSALMS 38, HOMILY I"
