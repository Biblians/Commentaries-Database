[[commentary]]
quote='''
And what does sin smell of? Concerning this the prophet says the following: "My wounds stink and fester because of my folly."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"


[[commentary]]
quote='''
These are they who can also say what follows: "for my scars have festered and rotted." "Do not," says the Savior, "cast your pearls before swine," there calling swine those who take delight in the stenches of their sins, who seek out every stench as a most sweet odor. Consider, then, the sinner who takes delight in his sins and is glad in his evils: since he too wallows in stinking dung, and perceives no feeling of his own stench, which is given off from the dung of sin, but takes delight as though in the highest pleasures and most pleasing delights. But if it should happen to this man at some time to lay aside the sense and smell of swine and to receive the sense of the word of God, so that he can feel the stench of his own sins: immediately, turned to repentance and seeking amendment, he becomes impatient of his own stench, crying out to the heavenly physician, and, showing the scars of his rotted wounds, he says: "My scars have festered and rotted in the face of my folly." And rightly here has he named sin folly. For no wise man ever commits it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily06.html'
source_title="HOMILIES ON PSALMS 38, HOMILY I"
