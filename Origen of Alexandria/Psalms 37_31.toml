[[commentary]]
quote='''
"The law of his God is in his heart". Not only in his mouth will the righteous meditate wisdom, and with his tongue speak judgment, but in his heart also he bears the law of God; for the law, set like a certain root in the depth of the heart, germinates words of righteousness, words of holiness, which the righteous man brings forth from his heart — and not only word, but also acts and deeds. The Jews almost unceasingly meditate the law of God with their mouth and their lips, but they do not have it fixed in the depth of the heart, and therefore it is said to them: "This people honors me with their lips, but their heart is far from me". We therefore, if according to what we read we meditate wisdom with our mouth, and with our tongue speak judgment, and the law of God be in our hearts, shall obtain that which follows: "And his steps shall not be supplanted". I think we remember those things which a while ago we discussed concerning the steps, and it is needful for us to call to memory what was said, that we may see how certain persons, as they walk, are supplanted and their steps are poured out. But if you keep these things in memory and retain them more diligently, you ought to know that if you meditate the wisdom of God in your mouth, and your tongue speaks judgment, and the law of God be in your hearts, your steps shall never be supplanted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily05.html'
source_title="HOMILIES ON PSALMS 37, HOMILY V"
