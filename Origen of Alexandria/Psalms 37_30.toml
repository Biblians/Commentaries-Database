[[commentary]]
quote='''
The Law, indeed, wishing us to open our mouth to the word of God, commanded, saying: "You shall speak", it says, "these things sitting in your house, and going by the way, and lying down, and rising up". But Solomon too in the Proverbs marks out something similar in a brief admonition, saying: "Open your mouth to the word of God". In like manner now also the Prophet teaches us, when he says: "The mouth of the righteous shall meditate wisdom". For truly nothing else ought to proceed from the mouth of the righteous except wisdom. Wherefore you also, whoever of you are the less instructed among the brethren, hearing the word of the Prophet, give diligence and take care, along with the works of righteousness, to bring forth also from your mouth the word of wisdom. And that this precept may not seem difficult to you, I will suggest to you a brief word of wisdom. The Apostle says that Christ is the power of God and the wisdom of God. If therefore you always speak of Christ, if you always meditate upon his words, if you hold his precepts in your mouth, worthily will your mouth meditate wisdom. For this is not the only meditation of wisdom, if one is able to teach, or to dispute more broadly in the Church, or to refute those who contradict. This too is indeed a work of wisdom, but one man does more, another less. In one man, this very fact that he believes the wisdom of God is reckoned as wisdom; in another, this too, that he acquiesces to the wise and loves the sayings of the wise, is called wisdom; and in some, even merely to inquire about wisdom is reckoned as wisdom. Only observe this one thing, brethren, that none of you be found not only not to speak nor meditate wisdom, but even to hate and to oppose those who bear a zeal for wisdom. For the unlearned are wont to have, together with their other faults, also this worst one, that they think those who have given their labor to the word and to teaching to be empty and superfluous, and they embrace their own ignorance more than the studies and labor of those others; and, changing the names, they call the exercises of those men wordiness, but their own indocility or ignorance they call simplicity. Yet the best of all is he who proves wisdom by works, and who knows himself to be wise by the uprightness of his life. Blessed therefore is he who opens his mouth to the word of God, and, advancing in age according to Christ, shall advance also in wisdom. Certainly, if we cannot advance further in wisdom, let it at least not weary us to observe this: to open our mouth more frequently in psalms and hymns and spiritual songs and in prayer or in the honor of God. For this too is no small meditation of wisdom, so that through it the mouth of the righteous may be found always to meditate wisdom. Yet it does not seem to me idle that he did not say, the mouth of the righteous meditates wisdom, which could at any rate look to the present time, but he said, "shall meditate wisdom"; which without doubt looks to the future time, in which too all the other interpreters, except one, agree. Lest therefore perhaps this tense designate something mystical, by which, namely, there is indicated some such future hope of the promise to come, and of grace, and of the inheritance, that the mouth of the righteous be filled not with food and drink, nor with delights and pleasures, not with feeding upon banquets, but with meditating wisdom. For beyond, there will not be anyone unlearned in the kingdom of God, none will remain indocile, none will be a stranger to the knowledge of things; we shall all be made, if only we shall be worthy, disciples of wisdom. If anyone placed here is imbued and instructed in those things which, placed in the flesh, he is able to attain, there, now illumined by more perfect disciplines, even those things which here were sought by study and labor will come to serve as an abridgment for the instruction to come. But he who here has not yet laid down the first rudiments, but still speaks as a little child and understands as a little child, there too shall be instructed as a little child, so that, having at length become a man through the advances of wisdom, he may lay aside the things that are of a little child. Or does not the Law also designate something of this kind, if it be understood spiritually, when it says: "You shall speak of them sitting at home, and going by the way, and lying down, and rising up"? Which we can understand thus: sitting at home and lying down, when in the Church, which is the house of God, we speak the word of God, being, namely, placed in this body; going by the way, in that way which says: "I am the way", we speak the word of God; and rising up, when we shall have risen from the sleep of death in the resurrection, then we speak those things which are perfect, rising up from the sleep of death, as Solomon too says of him who has made wisdom his friend and familiar, that "if you sit down, you shall be without fear, and if you sleep, you shall gladly take your sleep, and you shall not fear the terror that comes upon you, nor the assaults of the impious rushing upon you". Let these things suffice concerning that which is written: "The mouth of the righteous shall meditate wisdom", to which is added: "And his tongue shall speak judgment".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily05.html'
source_title="HOMILIES ON PSALMS 37, HOMILY V"

[[commentary]]
quote='''
In a twofold manner is the tongue of the righteous understood to speak judgment: either for the reason that he speaks all the things he speaks with right judgment, and with deliberation and with counsel, and nothing through wrath, nothing to please men, nothing out of sadness, nothing out of fear — which things severally are wont, at any rate, not to preserve for men an intact judgment; or certainly because the righteous always speaks of the judgment to come, so as always to admonish either himself or those who hear him concerning the fear of the judgment to come, and concerning the punishments that have been prepared for sinners, concerning the future examination, but also concerning the promises of the saints which have been prepared for them by God — and so that he may both save himself and those who hear him. And in this manner will it be fulfilled that the tongue of the righteous shall speak judgment. But if it is fitting here too to observe the inflection of the future tense — since he did not say, speaks, but "shall speak" — we can also understand in this something of this kind: that now, however much it is that we can either speak or feel concerning the judgment of God, it is necessary for us to know that which the Apostle defines, saying: "How unsearchable are his judgments, and his ways past finding out!" But if we shall be able to arrive at that perfection of which he says: "But then face to face", that is, when the things themselves shall become more evident to us, when we shall have begun to recognize the reason of each single thing which in this world either has been done or is being done — with what judgment they have been done, or what judgment God uses in each single case, by what dispensations of his providence; if anyone shall have been worthy to consider and to perceive how the judgments of God are a great deep; when we shall be able more fully to receive the grace of that Spirit which searches all things, even the deep things of God — then truly and completely, according to the distinction of the prophetic word, will the tongue of the righteous speak the judgments of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily05.html'
source_title="HOMILIES ON PSALMS 37, HOMILY V"
