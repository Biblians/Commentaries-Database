[[commentary]]
quote='''
Those therefore who on this account are troubled and anxious, God will be their protector in the time of tribulation, in the time of judgment, when the impious shall be delivered to punishments: then the Lord will both help them in the time of tribulation, and deliver them, and take them away from sinners — not only from sinful men, but also from the contrary powers, or certainly at that time when the soul is separated from the body, and there meet it the sinful demons, the adverse powers, the spirits of this air, who wish to detain it and recall it to themselves if they shall have recognized in it anything of their own works and deeds. For to each soul as it goes forth from this world there comes the prince of this world, and the aerial powers, and they inquire whether they may find in it anything of their own; if they shall have found avarice, it belongs to their part; if wrath, if luxury, if envy, and each single one of the things like these, if they shall have found it, it belongs to their part, and they claim it for themselves, and drag it to themselves, and turn it aside to the portion of sinners. But if anyone has imitated Him who said: "Behold, the prince of this world will come, and in me he has nothing", if anyone has so guarded himself, these sinners indeed come, and, seeking in him the things that are theirs, and not finding them, they will nevertheless attempt violently to wrench him aside to their part, but the Lord will deliver him from sinners. And perhaps on this account we are bidden, with a certain mystery, to ask also in prayer, saying: "But deliver us from evil". But the cause by which the Lord delivers his righteous ones from sinners — whether in the time of departure, or in the time of judgment, when that day shall have come which, according to the Prophet, is a day of necessity and of straitness, a day of darkness and of destruction, the day of judgment — then therefore he subjoins the cause by which they deserve to be delivered, and says, that "they hoped in him". Hoping therefore in himself, he will deliver them both from tribulation and from necessity. But how one ought to hope, I wish to show you from the holy Scriptures. Just as "no one can serve two masters", so no one can hope in two masters. No one can hope in the uncertainty of riches, and in the Lord. No one can hope in princes, and in God. No one can hope in the strength of a horse, and in Him. No one can hope in the world, and in God. For unless you hope in God alone, and God see that your hope has been turned unto the world eternal, and that you bear no other hope at all except in Him who gives life to the dead, and calls the things that are not as though they were, you will not be able to be delivered from sinners. For He alone is the one who saves those who hope in Him, through Christ our Lord, to whom is glory and power unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily05.html'
source_title="HOMILIES ON PSALMS 37, HOMILY V"
