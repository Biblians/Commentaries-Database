[[commentary]]
quote='''
"Who repay me evils for good". I indeed did good with them, but they, forgetting my good deeds, repaid evils for good, they charged me, because I followed righteousness. My enemies charge me and reproach me for those things, if any were ever committed by me, and are not ashamed at me who follow after righteousness, nor grant pardon for past evils in return for present goods. But do You, O Lord, "because I followed after righteousness, do not forsake me, O Lord my God". And this is the voice of one confessing and asking for mercy: "Do not forsake me, O Lord my God, do not depart from me". In another psalm indeed he says: "Take not Your Holy Spirit from me". In this he says to God Himself: "Do not depart from me". From which it is shown that from certain persons, according to their merits, God departs, and with others, according to their merits, He remains. Unhappy, however, is that man from whom God has departed, but blessed is he with whom God remains. "Attend unto my help, O Lord, God of my salvation". Let us too, therefore, pray and say: Attend unto my help, for great is the battle, and the adversaries are mighty. The foe is hostile, the invisible enemy assails through these visible ones. Attend, therefore, unto our help, and help us through Your holy Son our Lord Jesus Christ, through whom You have redeemed us all, through whom to You be glory and power unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily07.html'
source_title="HOMILIES ON PSALMS 38, HOMILY II"
