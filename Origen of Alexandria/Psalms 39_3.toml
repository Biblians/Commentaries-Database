[[commentary]]
quote='''
Whence therefore will you burn? Whence will "coals of fire" be found in you, who are never set on fire by the word of the Lord, never inflamed by the words of the Holy Spirit? Hear also elsewhere David himself saying: "my heart grew warm within me, and in my meditation a fire blazes forth". Whence do you grow warm? Whence is fire kindled in you, who never meditate on the divine words — nay, what is more unhappy, you grow warm at the spectacles of the circus, you grow warm at the contests of horses, at the struggle of athletes? And that fire is not from the altar of the Lord, but is that which is called "strange fire".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily09.html'
source_title="HOMILIES ON LEVITICUS 9"

[[commentary]]
quote='''
In what follows he still further describes the passion of the one who advances, when he says: "My heart grew hot within me". For when one hears the voice of the evil-speaker and the detractor, he cannot be without sorrow, like that man who is perfect, who by long-continued constancy has already merited blessedness: but this man feels pain, and feeling pain, with his heart growing hot, boils within himself and is troubled, yet not to such a degree as also to bring forth a word with a troubled heart, but he indeed grows hot in his inner parts, moved by the indignity of the matter, yet he boils away the flames of his heat through silence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily08.html'
source_title="HOMILIES ON PSALMS 39, HOMILY I"

[[commentary]]
quote='''
Let us see also another saying of the righteous man, which too with the utmost zeal we ought to be jealous to emulate. "And in my meditation a fire shall blaze forth". I too meditate upon the words of the Lord, and I frequently exercise myself in them, but I do not know whether I am such that in my meditation, from each single word of God, a fire proceeds, and kindles my heart, and inflames my soul to observe the things that I meditate. I too now speak the words of God, but I would wish that first in my own heart, and secondly also in the minds of the hearers, they might blaze forth: just as were those words which Jesus spoke, of which those who had heard said: "Was not our heart burning within us when on the way he opened to us the Scriptures"? Would that now too, as we open the divine Scriptures, our heart might grow hot within us, and in our meditation a fire be kindled, and we be stirred to the doing of the things that we hear and read. Such, in short, were also the words of Jeremiah, according to what is written, when the Lord says to him: "Behold, I have given my words behind into thy mouth a fire". Why a fire? Because the words which he spoke kindled the hearers, and nothing lukewarm nor cold remained in them: but just as fire consumes and destroys all matter, and receives into itself nothing unclean or polluted; so also those whose heart the fire of the divine word has kindled will no longer suffer to be polluted with material and worldly filth, will receive into themselves nothing lukewarm, and what is worthy to be vomited out, nor will they suffer their charity to grow cold as iniquity is multiplied in them: but their lamps will always be lighted, and their lanterns burning, and they themselves ready as servants awaiting their lord returning from the wedding. Or was this not that fire of which our Savior said: "I came to send fire upon the earth, and what do I wish but that it burn"? This without doubt is the fire which puts to flight the cold of sin, and recalls the warmth of the spirit. This is surely also that which is related in the Acts of the apostles, when it says that there appeared to them divided tongues as of fire, and that they settled upon the apostles, evidently for the reason that, being about to preach the word of the Gospel, they ought to be strengthened by the grace of fiery vigor, so that the souls of the hearers might take the flame through the transmission of the word. But whence to me this, that the fire of the tongue might come into my heart, and that from a fiery tongue I too might bring forth a word, so that from me a swift fire might be kindled by my words in the hearts of the hearers, and might convict him who has sinned, and my word might become to him a chastisement, so that, scorched and inflamed by my words, he might come to repentance, which works stable salvation out of the sorrow which is according to God, which he received from the rebuke of the word of God? And would that I might so kindle every soul of the hearers, that whoever is conscious to himself, not bearing the burning of our word, but inflamed within in all his inward parts, might the more swiftly consume the hidden filth of vices lurking within: so that, after he had destroyed all that is proper and dear to the flesh and to the grosser matter, then at last this fire might become in him a light and a burning lamp: which ought to be placed not under a bushel, but upon a candlestick, that it might give light to all who are in the house. If therefore the word you have heard has kindled you, and you have understood what the Apostle said: "And who is it that gladdens me, except him who is grieved by me"? Since his words were fire, and the Apostle rejoiced wherever he saw anyone, upon hearing his word, grieved and pricked in conscience from the things he had heard, kindled by a certain fire of his conscience from the recollection of his fault, therefore he said: "And who is it that gladdens me, except him who is grieved by me"? So therefore let us too do enough that in our meditations a fire may be kindled, which first may burn us, both by the recollection and the conscience of our sins, but afterward, when we are now purged of vices, may illumine and enlighten us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily08.html'
source_title="HOMILIES ON PSALMS 39, HOMILY I"
