[[commentary]]
quote='''
"Because those who act wickedly shall be exterminated; but those who wait for the Lord, they shall possess the earth by inheritance". It appears that wickedness is indeed another kind of evil, distinct from the other sins. Hence here too the divine word describes one man a sinner, and another wicked, just as there also it uses a similar distinction when it says: "Break the arm of the sinner and of the malignant", that is, the wicked. But the Lord too in the Gospel called the devil not merely a sinner, but malignant, or evil, and when he teaches in prayer, he says: "But deliver us from evil". And elsewhere: "An evil man has done", or a malignant one. Some define πονηρίαν, that is, wickedness, to be spontaneous or voluntary malice. For it is one thing to do evil through ignorance, and to be overcome by evil; it is another to do evil by will and by zeal, and this is wickedness. Hence also deservedly the devil is called by this name πονηρός, that is, malignant, or wicked. But the Savior too, reproaching us, said: "If then you, being evil, know how to give good gifts to your children". And now, therefore, he says: "Since those who act wickedly shall be exterminated; but those who wait for the Lord, they shall possess the earth by inheritance". There is also a certain other earth, that of which Scripture says, flowing with milk and honey, which the Savior in the Gospels promises to the meek, saying: "Blessed are the meek, for they shall possess the earth". This earth of ours which we inhabit is by its proper name called the dry land, just as also that heaven which we behold is properly called the firmament. But from the appellation of the other heaven this firmament too received the name of heaven, as the Scripture of Genesis teaches. What then is it? In the present life indeed we use these visible heaven and earth, in which of the true heaven and the true earth we find nothing else but the names: but I judge that they are so named here for this reason, that, when these are so named, those things which are true and great may come to the desire and remembrance of those who name them. But who are they who shall possess the earth by inheritance? "They who wait", he says, "for the Lord". We wait for the Lord, because he himself is our expectation and our patience, as it is written: "And now what is my expectation? is it not the Lord?" Just as, therefore, the Savior is wisdom and peace and righteousness, so also he is expectation, or patience. And just as by participation in his righteousness we are made righteous, and by participation in his wisdom wise, so also by participation in his patience we are made patient. He is, therefore, as it were a certain perennial fount, from which we can draw both patience, and righteousness, and wisdom, and all whatsoever are the goods of the virtues; if only we bring good, worthy, and pure little vessels of ours to the fount. He says therefore: "But those who wait for the Lord, they shall inherit".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily02.html'
source_title="HOMILIES ON PSALMS 37, HOMILY II"
