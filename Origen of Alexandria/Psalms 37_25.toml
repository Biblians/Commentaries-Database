[[commentary]]
quote='''
They can never be oppressed by the fasting of famine whose bread is that "they should do the will of the Father who is in heaven" and whose soul that "bread that comes down from heaven" nourishes.
'''
source_url=''
source_title="HOMILIES ON PSALMS 16:3"


[[commentary]]
quote='''
"I have been young, and now am old, and I have not seen the righteous forsaken, nor his seed seeking bread. All the day he has mercy and lends, and his seed shall be in blessing". Those who say that the words of the divine Scripture are to be taken simply and according to the history, will say without doubt that in this passage David is affirming that, the age of his youth being passed, when he had now come even to the time of his old age, in all this time he had never seen the righteous man so forsaken as to lack bread. And what do we make of Paul the Apostle, who, enumerating and expounding the lives of the prophets, says that they, needy, tribulated, wandered in goatskins through the caverns of the rocks and through the caves; and, recalling of himself, frequently says, in hunger and in thirst? And when we learn from the histories of the Scriptures that the righteous frequently suffer these things, how now is it to be thought that David says this according to the simple understanding? But let us see whether perhaps there are certain ages of our inner man, after the likeness of the outer and bodily age. Whence also sometimes it is said of men already of mature age that they are children, and of others that they are old, and of others that they are young — and this surely does not fittingly apply to bodily age. In fine, when very many before Abraham had lived six hundred and five hundred, at the least three hundred years, of none of them was it said that he was aged and full of days, save of Abraham only. From which it is to be understood that this was designated not of the age of the body, but of the maturity of the inner man. Whence we also ought to wish to be called elders and seniors not for the age of the body, nor for the office of the presbyterate, but for the perfect sense of the inner man and the gravity of steadfastness — as also Abraham was called an elder, nourished in a good old age. There is, then, a certain childish age according to the inner man, and there is also a youthful age, and there is an aged age, according to what the Apostle said: "When I was a little one, I spoke as a little one, I was wise as a little one, I thought as a little one; but when I became a man, I did away with the things that were of a little one". I understand these things to be said by the Apostle not of bodily age, but because, when in the beginning he had believed, he was a little one lately born, desiring the reasonable and guileless milk; then he understood the Scriptures as a little one, was wise concerning the Gospel as a little one, thought as a little one; but after this, advancing in age after the likeness of Christ — of whom it is written that "He advanced in age and wisdom and grace with God and with men" — he laid aside the things that were of a little one: and therefore he said, "When I became a man, I laid aside the things that were of a little one". So therefore is David also to be understood to say: "I have been young, and now am old"; as if he said, When I was a little one according to the inner man, now I am already grown old. For unless he had grown old, he would not be a prophet. For it belongs to the aged to prophesy. Even if you should sometimes see a youth prophesying, do not hesitate to say of him that according to the inner man he has grown old, and therefore he is a prophet: in fine, Jeremiah, when he had heard: "Before I formed thee in the womb I knew thee, and before thou camest forth from the womb I sanctified thee, and made thee a prophet among the nations", answered: "I am a youth, and I know not how to speak". But He who granted him the grace that he should not be a boy, but should be an elder according to the inner man, said to him: "Say not, I am a youth". Otherwise, unless these things be so understood, what reason would there be that it should be said to a boy, whose age is youthful and untrained, "Say not, I am a youth"? — that is to say, do not say what is true. He was therefore a youth according to the age of the body: but since the Lord had given His words in his mouth, by which he should root up and overthrow and scatter, and again build and plant — which virtue of the words, illuminating and sanctifying his soul, did not allow it to be childish — therefore rightly it is said to him: "Say not, I am a youth". Similarly, then, this also which David says: "I have been young, and now am old, and I have not seen the righteous forsaken, nor his seed seeking bread", is to be perceived according to what we said above concerning the youthful or aged age of the inner man; otherwise, according to the outer man, if the righteous man is to be thought forsaken by God when sickness of body comes, when tribulation, when poverty and each several trouble of this life is engendered — these things are especially wont to happen to the righteous, for whom it is customary even to suffer persecution for the name of God, but they are not forsaken when, suffering and enduring all these things, they say: No one shall separate us from the charity of God, which is in Christ Jesus, neither tribulation, nor hunger, nor distress, nor nakedness, nor sword, nor height, nor depth, nor any other creature. In fine, the prophets, who went about in the desert through the caverns of the rocks and the caves, needy, tribulated, afflicted, though they wandered in the deserts and were forsaken by men, yet a multitude of angels surrounded them. So likewise Elisha, when he was forsaken by men, was surrounded by a heavenly host, according to what is written: Open the eyes of this boy, that he may see that there are more with us than with them. And he saw the whole mountain full of horsemen and chariots. For the righteous man is never alone, but is supported not by the fellowship of only one, or of two, or of three angels only, but a host of the heavenly powers is at hand for him. But if there is need yet of more testimonies, take up also another. Jacob, so long as he was in the house of his parents and with his brother Esau, was not with the host of angels; but when he had withdrawn to the solitude of the desert, and journeyed alone toward Mesopotamia, he slept in a certain place, and rising he says that this place is called παρεμβολή, which is "camp," for the reason that he saw there not one, but several camps of God. These things we say concerning the fact that the righteous man is by no means said to be forsaken — in spiritual goods, at least. For in bodily goods, see what the righteous man said, in which things also he glories: "Even to this", he says, "hour we both hunger and thirst, and are naked, and are buffeted, and we labor working with our hands". And again: "We are cursed and we bless, we suffer persecution and endure it, being blasphemed we entreat". But because such a one was not forsaken in spirit, he said: "Wherefore I please myself in my infirmities, in injuries, in necessities, in persecutions, in distresses for Christ". In two ways, then, is he forsaken who is forsaken. Bodily indeed in this manner, in which we said above that all the saints suffer, and are not harmed. But those are forsaken in spirit of whom it is said: "Since they did not approve to have God in knowledge, God delivered them up to a reprobate sense, that they should do the things that are not fitting, being filled with all iniquity, wickedness, avarice, full of envy, murders, contention, guile, whisperers, detractors, hateful to God, contumelious, proud, haughty", and the other evils of this kind, for which they merited also to be forsaken. Which things, since they are alien to the righteous man, therefore he says, "I have not seen the righteous forsaken, nor his seed seeking bread". Again, if you hear "his seed," will you return to bodily seed? And how will you find this true, that the seed of the righteous does not seek bread, when you see that Ishmael, born of the seed of Abraham, when his mother, fleeing her mistress Sarah, carried him in the desert, both sought water indeed and bread? But also Esau, coming from the way, was failing from want of food, and to such a degree was he cast headlong by the rage of hunger, that he sold away his birthright for a food of lentils. It behooves us, then, according to what we said above, to understand also the seed of the righteous spiritually. And what else is the seed of the righteous worthy to be thought, save the disciple of the righteous man, who, having received from him the seed of the word of God, is begotten unto eternal life? For example's sake, if by your prayers I should merit to be righteous, and to receive from the Lord grace in the word of wisdom and of knowledge, so that I could, according to the grace which I myself had merited from the Lord, minister to you also the word of God, and sow it in your souls; then afterward the word of God, having entered into your souls and clinging in your heart, would form your minds according to the form of the word itself — that is, that you would will this and do this which the word of God wills, and through this Christ Himself would be formed in you — then you would truly be made the seed of the righteous, which does not seek bread, having namely always in you that bread which descended from heaven. But if you answer me and say: How many heard Peter and Paul, who surely were most righteous teachers, and yet sinned — and how then shall they be called the seed of the righteous? But see whether perhaps, just as not all who are from Abraham are also called the seed of Abraham, to whom it is said, "If you were the sons of Abraham, you would surely do the works of Abraham"; so also those who heard Peter and Paul, and did not do the things that Peter or Paul had taught, were not their seed, because the seeds of the word received from them they cast off and poured out from their soul as by a kind of abortion. In fine, also in this very psalm he says in another place: "The seed of the impious shall be exterminated". But it is certain that the bodily seed of the impious will not be exterminated. Job, in fine, was of the seed of Esau, the seed of an impious man, and yet he is not exterminated, but is manifested as righteous by the Lord, and is shown to be a prophet, and merits to be praised by God above all the righteous. But this is what we said above, that as the seed of the righteous is his word and doctrine — which word so feeds and refreshes souls that they are denied to lack bread, because Christ is their bread — so on the contrary the doctrine and word of the impious is their seed, which is said to be exterminated, because it is composed of falsehood, and, when the light of truth comes, it is certain that the darkness of the lie will be put to flight.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily04.html'
source_title="HOMILIES ON PSALMS 37, HOMILY IV"
