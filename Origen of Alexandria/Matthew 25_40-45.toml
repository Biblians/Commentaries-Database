[[commentary]]
quote='''
For if we truly believe that which the Lord said of each one of his servants, that "I was hungry, and you did not give me to eat", and the things which he adds and says, that whoever did it to one of my least, did it to me, it is consequent that he say this too: You who cursed me, disparaged me, and spoke false things against me, and accused me. And if we shall say: Lord, when did we curse you, or when did we disparage you, or when did we speak false things against you? then he will say to us: "Amen I say to you, that what you did to one of my least, you did to me". For just as, giving to eat to one of these, you did it to me, and giving to drink to one of these, you gave to me, and just as, clothing one of these, you clothed me; so, cursing one of these, you cursed me, and if you blessed or honored one of these, you blessed me, and you honored me, as also elsewhere he nonetheless says: "He who receives you, receives me"; and: "He who spurns you, spurns me".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily03.html'
source_title="HOMILIES ON PSALMS 37, HOMILY III"
