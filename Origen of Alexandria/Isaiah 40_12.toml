[[commentary]]
quote='''
Because we come upon difficult passages, I would wish to inquire whether somewhere in the Scriptures we find any such thing, from which that which seems obscure could be opened up more plainly. In Isaiah I remember it is written: "Who has measured", he says, "the water with his hand, and the heaven with a span, and all the earth with his fist"? From which let whoever is the more prudent of the hearers consider, through the several passages, the differences of the measures, how the part of life which is heavenly, of those indeed who merit to be called heaven, is said to be measured with the span of God, whatever that span of God is: and of those whose life is still earthly, their life is measured with the fist of God. But to inquire now the difference of the divine fist would perhaps exceed both our speech and your hearing. Nevertheless just as there he measured the water with his hand, the heaven with a span, and all the earth with his fist, and weighed the mountains in a balance, and the hills in a scale; so also here, according to the same consequence, this measure is to be understood, since to God nothing is without measure, nothing without weight, but all things stand for him in number and measure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily08.html'
source_title="HOMILIES ON PSALMS 39, HOMILY I"
