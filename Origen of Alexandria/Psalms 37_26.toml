[[commentary]]
quote='''
"All the day he has mercy and lends". The righteous man all the day has mercy, and all the day is said to lend: he is free for nothing else than to lend of that money which abounds to him. Shall this too here be thought, that the righteous man sits all the day at his table, and, having money before him, lends it to those suffering need? Perhaps this will be thought to be what was said through Moses: "And thou shalt lend to many nations, but thou thyself shalt not seek a loan". But it is certain that it is spoken of the Lord's money, which is commanded to be paid out to the money-changers, brought forth from the treasuries of the wisdom and knowledge of God, that we may make of five talents ten, of two four. And the more abundant money we have in our soul, so much the more shall we lend all the day. But even now, although I am not righteous, yet this which I speak, I lend you the Lord's money: but do you pray that I may be made righteous and may be able to lend you the money of righteousness, that not only by word, but also by the example of righteousness, I may teach righteousness. Therefore, just as there are unjust moneys, which are gathered unjustly and against the law through calumny and lies, and the diverse evils of avarice; and again there are moneys which are gathered justly and according to the law, that is, from one's own and just labors: so also in word and doctrine it is found to be. There are words gathered neither well, nor justly, nor lawfully — as are the words of heretics, and the doctrine gathered against the law of God — which we ought to shun as unjust and pestiferous money, and gathered from evil. Pray, therefore, that this our money which we lend you may be found wholly from just labors, wholly proceeding from the Lord's coin, that both you may sign over the interest entire, and we may not hear, "Thou oughtest to have given my money to the money-changers".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily04.html'
source_title="HOMILIES ON PSALMS 37, HOMILY IV"


[[commentary]]
quote='''
"I have been young, and now am old, and I have not seen the righteous forsaken, nor his seed seeking bread: all the day he has mercy and lends". In the passages above it is said that the sinner borrows and does not repay; here, that the righteous man all the day has mercy and lends. And see how, in contraries, they are matched. The sinner not only borrows, but also, when he has received, does not repay: but the righteous man not only does not borrow, but also lends: and not only once or twice, but all the day he lends — that is, lending through the whole time of his life he has mercy, whence also his seed shall be in blessing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily04.html'
source_title="HOMILIES ON PSALMS 37, HOMILY IV"
