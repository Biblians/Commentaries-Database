[[commentary]]
quote='''
"Keep innocence, and behold equity". The word of God commands us to keep innocence. To such a degree has the corruption of morals advanced among men, that among very many innocence is judged as folly: but Scripture judges this to be the work of the highest virtue, because it judges that to be innocence which harms no one, injures no one. When therefore he says: "Keep innocence", this is what he commands us to observe, that we injure no one, harm no one. And this we obtain if always, with an intent and vigilant mind, we behold equity. Equity therefore in this place I take thus, as truth, as righteousness, as life, which is Christ. For by beholding these things, we shall at the same time also behold God. "Keep" therefore "innocence, and behold equity, for there are remnants for the peaceable man". I ask what these remnants are which are reserved for the peaceable man? We are wont to speak of remnants when the spirit is separated from the body, as though, the greater part of the man being reckoned in the spirit, the part of the body that remains over is named the remnants. If therefore we believe the words of the Apostle, saying that the body "is sown in corruption", namely at the time of death, "and shall rise in incorruption", when the time of the resurrection shall have come, when this corruptible also shall have put on incorruption, and this mortal shall have put on immortality, then there shall be remnants for the peaceable man. But there the remnants of the peaceable man shall be in peace and in rest. For the Lord too says of the peaceable, that they also "shall be called sons of God". "Father, I will that where I am, these too may be with me". There are therefore, with Christ, the remnants of the peaceable man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily05.html'
source_title="HOMILIES ON PSALMS 37, HOMILY V"
