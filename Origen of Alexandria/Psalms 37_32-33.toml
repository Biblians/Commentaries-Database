[[commentary]]
quote='''
After these things he says: "The sinner considers", he says, "the righteous". The sinner considers and gazes upon the righteous, and it is grievous to him to behold, and therefore he considers him in order to deliver him to death: which those men without doubt did against the Savior who slew the prophets, and crucified God, and have persecuted us even now; and the people of God which is Christ's, that is, the disciples of righteousness, they consider and desire to deliver to death, and they seek to put them to death. But what does the righteous people of God and disciple of righteousness say? It uses the word of the Master, and says: "You would have no power over me, unless it were given you from above". This can also be fitted, in the time of the persecution of the Gentiles, to the holy martyrs and confessors. For the impious persecutors consider each single one of the righteous and seek to put him to death. But lest such an exposition make you unconcerned in a time of peace, remember that the righteous has a daily persecutor, the devil, and it is he who considers the righteous. For he lies in wait always, and like a roaring lion goes about seeking whom he may devour. But if you are full of faith and trust in the Lord, see what is promised: "But the Lord will not leave him in his hands", namely those of the sinner, "nor condemn him when he shall be judged with him". He understands this which he says, "when he shall be judged with him", in two ways: that is, either when the righteous is judged by God, or when God himself is judged together with the righteous. For frequently divine Scripture teaches that these things come to pass, saying that "the Lord himself will come into judgment". When therefore the righteous shall be judged together with the Lord, he shall not be condemned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily05.html'
source_title="HOMILIES ON PSALMS 37, HOMILY V"
