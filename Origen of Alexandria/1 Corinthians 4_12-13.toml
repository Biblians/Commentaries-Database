[[commentary]]
quote='''
For in this place I think three things can be assigned from the Scriptures, in which he says that the sinner stands against him, and speaks in his ears the things by which he can be irritated and exasperated to retaliate. And if indeed I am small, I seek the like, and an eye for an eye, a tooth for a tooth, and I repay curses for curses. But if I have already advanced somewhat, yet am not yet perfect, I both keep silence and bear the reproaches patiently, and answer nothing at all. But if I am perfect, I do not keep silence, but when I am cursed, I bless, just as Paul also said: "We are cursed and we bless, we suffer persecution and we endure it, being blasphemed we entreat". And since those who do these things, that is, who render blessings for curses, who for blasphemies entreat, seem to men to be as it were cattle and refuse, as those who have no sense of injury, therefore he added, saying: "We are made as it were the refuse of this world, the offscouring of all". But we are unwilling to become with the apostles the refuse of this world, but wish not to be despised by men, nay rather even to be feared, and we do enough to repay those who harm us, and to anticipate the vengeance which the Lord reserved for himself, saying: "Vengeance is mine, I will repay, saith the Lord". But if we cannot advance so far, and ascend to that summit of truth, so as to say with Paul: "We are cursed and we bless, we suffer persecution and we endure it, being blasphemed we entreat", let us at least say this which we are still taught through the Prophet: "While the sinner stood against me, I was dumb and was humbled, and I kept silence from good things".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily08.html'
source_title="HOMILIES ON PSALMS 39, HOMILY I"
