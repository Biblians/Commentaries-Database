[[commentary]]
quote='''
What he will do, learn from what follows: "He will bring forth your righteousness like the light, and your judgment like noonday". Your righteousness, which you have done in secret, and have revealed only to God, this God will bring forth like the light, and will show you righteous, illumined by the sun of righteousness, to heaven and earth, and to all who are in heaven he will show the light of your righteousness, and, if it may be so said, he will boast of you as of a son, as of one who has received the spirit of adoption. He will bring forth therefore your righteousness like the light, because he who is righteous according to the commandment of the Lord does his righteousness thus, as he himself commanded, saying: "But you, when you do your righteousness, let your left hand not know what your right hand does". This righteousness therefore, which is done in such a way that it does not appear to men, nor so as to capture human glory, but is done in secret, so that the Father who sees in secret may repay openly in his own time — it is brought forth by God like light. "And your judgment like noonday". For all the judgments of the righteous man, whatever he has judged, will be not only like light, but like the noonday light, which surely is the clearest and most splendid. For the fullness of light is designated at the noonday time. If therefore you are righteous and good, God will bring forth your righteousness like the light, and your judgment like noonday. Or certainly, in judgment when your case is examined, God will make the righteousness of your case manifest like light, and the judgment which he also decides he will make manifest like noonday. Knowing these things will be so, let us beseech the mercy of God, that he may grant us to become such, that we may be held worthy, those whose light of righteousness God himself may bring forth into the midst, and our judgment like noonday clear and bright, having the true light in itself, our Lord himself, to whom be glory and dominion unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily01.html'
source_title="HOMILIES ON PSALMS 37, HOMILY I"
