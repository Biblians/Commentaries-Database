[[commentary]]
quote='''
Therefore I ask not to experience the power of your anger itself, since, receiving only its judgment and in a certain way seeing only its face, which is formed from the words of divine Scripture alone, I already grieve in my whole body and am thrown into confusion: nor is there any health in my flesh, nor peace in my bones — merely because I seemed to feel or see the face of your anger from the holy Scriptures, yet not the anger itself. And if from this alone the things I suffer are such, for this reason I pray that I may not suffer the anger itself. See, then, whether these things are not plainly said in that which he says: "And you have confirmed your hand upon me; nor is there health in my flesh in the face of your anger." He could have said, from your anger, but now he says, "from the face of your anger." For if he had said, from your anger, that would without doubt have been superfluous which he said above: "Correct me not in your anger." But now he said: "There is no health in my flesh in the face of your anger." Since indeed the face of your anger alone — that is, the very consideration of your indignation — has so terrified me and turned me, that there ought now to be no place in me for your anger: "Nor is there health in my flesh in the face of your anger." Concerning the man who had sinned at Corinth, the Apostle declared, saying: "To deliver such a man to Satan for the destruction of the flesh." Is it to be supposed that he wished the man whom he said ought to be delivered to Satan for the destruction of the flesh to become wicked? Rather, on the contrary, it is apparent that for the man's salvation he delivered his flesh to destruction. Indeed, he adds, saying: "I have delivered such a man to Satan for the destruction of the flesh, that the spirit may be saved in the day of the Lord," showing that the spirit cannot be saved unless the flesh be delivered to destruction. What, then, the destruction of the flesh is, hear. For what has been destroyed is without doubt dead. But the flesh lives in the sinner; the flesh is dead in the righteous man. On account of which the righteous also say: "Always carrying about the mortification of Jesus Christ in our body, that the life of Jesus Christ also may be made manifest in our mortal flesh." And again we have received a command, saying: "Mortify your members which are upon the earth." And blessed is he who has died to sin, according to what has been said: "The body indeed is dead because of sin, but the spirit lives as life because of justification." To be delivered, then, to the destruction of the flesh is such that the carnal sense may die in us, and the desire of the flesh may not live in it. For from the fact that the sense of the flesh dies, so that we may not be wise according to the flesh, the spirit is made safe. Otherwise, while the sense of the flesh lives in us, and the flesh lives, we cannot be wise about spiritual things. In this way, then, the Apostle delivered to the destruction of the flesh the man who had lived according to the flesh, so that, the sense of the flesh being dead, the spirit might be saved in the day of the Lord. If you have understood the apostolic word, let us return to what was proposed. Would that in my body, whenever I offend, and the offense comes from the sense of the flesh, the destruction of the flesh might be brought upon it, so that the spirit might be saved. For if the flesh is weakened, without doubt the advancing weakness reaches even to the mortification of the flesh: and then it is that it is rightly said that "there is no health in my flesh." But if the flesh is indeed not weakened, but returns to its own health — that is, so that it is wise about the things of the flesh and desires evil — then there is health in the flesh, which is by no means good for the spirit. This man, then, who is reproved, and who refuses to be reproved through the wrath of the Lord and to be corrected by his anger, shows the most just causes of this excuse, asserting that he is pierced by the arrows of the words of God, and so disturbed and terrified by the face of the Lord's anger alone, that there remains no health at all in his flesh — that is, no further desire of sinning. I remember that once, discoursing on that chapter of the Gospel in which it is written: "The spirit indeed is willing, but the flesh is weak," I perceived something of this kind: that before our Savior came to the cross and crucified the flesh and made it die — before it was perfectly mortified — he first said that his flesh was weak; and as long as the flesh was indeed weak, he said the spirit was willing; but when he delivers it to the cross and consummates it with perfect death, then he testifies that the spirit is no longer willing, but placed in the hands of the Father. And these things, describing them in himself, he offered as an example for our instruction. For on our account and for us he was weak. Therefore let us consider ourselves, whether our flesh is weak, whether it is not dissolved by delights and luxury — for this vicious health is at hand for it: see whether by daily abstinence the flesh is made weak, whether by continence the desires are restrained, lust is suppressed, the vices are quieted: then, even if it is not yet dead, nevertheless there is no health in your flesh, but even your members are for the time mortified upon the earth. And what is it that makes there be no health in the flesh? If we feel the face of the anger of God. For when we remember the anger of God, and bring before our eyes his countenance from the very contemplation of him — which for this reason has been called the face of anger — the flesh, disturbed and terrified, is weakened and grows faint.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily06.html'
source_title="HOMILIES ON PSALMS 38, HOMILY I"


[[commentary]]
quote='''
"There is no peace in my bones in the face of my sins." He too who has sinned, and after the sin remembers that he has sinned, ought to say these things, just as David himself said in the fiftieth psalm: "And my sin is ever before me." There are certain people who, when they have sinned, are utterly secure, and do not think about their sin, nor does it come to their senses what evil they have done, but they live as though they had committed nothing at all: these, therefore, cannot say that "my sin is ever before me." But when, after the deed, one is consumed and afflicted for his offense, and is driven by the goads of conscience, is gnawed without intermission and assailed by hidden refutations, such a one rightly says: "There is no peace in my bones in the face of my sins." There is indeed a certain face even of sins, and, so to speak, a certain color and appearance by which the things once committed are wont to be remembered and recognized. But when we have set our sins before the eyes of our heart, and, gazing upon each one, recognizing them we blush, and, being made penitent, we repent, then, disturbed and terrified, we rightly say that we do not have peace in our bones in the face of our sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily06.html'
source_title="HOMILIES ON PSALMS 38, HOMILY I"
