[[commentary]]
quote='''
He too who has sinned, and after the sin remembers that he has sinned, ought to say these things, just as David himself said in the fiftieth psalm: "And my sin is ever before me." There are certain people who, when they have sinned, are utterly secure, and do not think about their sin, nor does it come to their senses what evil they have done, but they live as though they had committed nothing at all: these, therefore, cannot say that "my sin is ever before me." But when, after the deed, one is consumed and afflicted for his offense, and is driven by the goads of conscience, is gnawed without intermission and assailed by hidden refutations, such a one rightly says: "There is no peace in my bones in the face of my sins."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily06.html'
source_title="HOMILIES ON PSALMS 38, HOMILY I"
