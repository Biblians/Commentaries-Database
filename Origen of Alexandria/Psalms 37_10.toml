[[commentary]]
quote='''
But after these things he added a certain mystical saying, which is beyond my hearing, and above my tongue, which exceeds my understanding. For he says, whether concerning all sinners, or concerning some one sinner — for he speaks in the singular: "Yet a little while, and the sinner shall not be". He says that there is indeed a little while yet from the present time up to the consummation of the age, or perhaps even beyond the consummation of the age, and until that avenging fire consume the adversaries. But if this comes to pass in some manner, the sinner shall not be; and by what reasoning it can come to pass that he be not a sinner, let him examine and inquire who can. "Yet a little while, and the sinner shall not be, and you shall seek his place and not find it". But not only shall the sinner not be, but neither shall there be a place of the sinner. And what is the place of the sinner, but these things which pass away? "Heaven", he says, "and earth shall pass away". Without doubt, therefore, together with the sin itself which has passed away, the place too of the sinner shall pass away. "Heaven", he says, "and earth shall pass away, but my words shall not pass away". Let us strive, therefore, to do the words of God, which do not pass away, lest perchance we too perish together with those things which pass away. For if we do sin, which passes away, without doubt we too shall be reckoned with those things which pass away. But if we do righteousness, which does not pass away, neither shall we ourselves pass away, but we shall remain with the abiding righteousness, according to that which is written: "Is not my hand able to save? or have I made my ear heavy that I should not hear? But your sins separate between you and God". But also from the beginning of creation it is said that not without some mystical reason the firmament was made, which should separate between the waters and the waters, and divide the habitation of mortals from the seats and habitations of the angels. From this, therefore, this dry land, which the Lord also named earth, was assigned as a place for us sinners. But certain other places too are named waters, over which the Spirit of the Lord is said to be borne. And certain other places are named the abyss, over which darkness is reported to be laid. And of the waters indeed it is said in another Scripture, that "The waters saw you, O God, the waters saw you, and were afraid". But of the abyss it says, that "the abyss was troubled"; without doubt because it has not peace, but has darkness laid over it. But the demons too in the Gospel are said to beg that they be not commanded to go away into the abyss, as into a certain place of punishment worthy both of themselves and of their deeds. Not only, therefore, shall the sinner not be, but even his place, whatever it is, shall be sought, and shall not be.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily02.html'
source_title="HOMILIES ON PSALMS 37, HOMILY II"
