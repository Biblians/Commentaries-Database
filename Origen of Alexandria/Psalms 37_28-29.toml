[[commentary]]
quote='''
"And the Lord will not forsake His saints, they shall be preserved forever". As he says that he shall dwell forever, so also they shall be preserved forever. Both of which look to the future time, or age, for which the saints shall be preserved, that thereafter they may endure in eternity. "The unjust shall be punished, and the seed of the impious shall perish; but the righteous shall inherit the earth". We have already said above of what sort is the seed of the impious, when we referred it to word and doctrine: and how it shall be exterminated, while every lie is put to flight by the light of truth as darkness. "But the righteous shall inherit the earth". And of this too we have already spoken above, how, whether the righteous or the meek, they attain the inheritance of that good and great land, and how they dwell in it forever and ever — not only forever, but forever and ever. See how great is the Lord's recompense. For the labor of thirty or forty, or at the very most fifty years, a man receives not only the recompense of this age, but forever and ever. But if anyone remains in the word of God, and clings to His wisdom, and persists in the eternity of light, he will attain even to this, that he may render to God glory forever and ever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily04.html'
source_title="HOMILIES ON PSALMS 37, HOMILY IV"
