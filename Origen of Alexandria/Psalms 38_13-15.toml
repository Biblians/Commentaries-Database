[[commentary]]
quote='''
"But I, like one deaf, did not hear, and like one dumb who does not open his mouth. And I became like a man who does not hear". When I was cursed, when I was charged, when men brought forth all reproaches against me, I was like one deaf, and I did not hear, and like one dumb I did not open my mouth, I returned no curses for the curses. But what does it profit us to expound these things? What does it profit us to open these things from the holy Scriptures, if we do not remember them at that very time when the matter requires it, when we are cursed by our brothers, when they disparage us, when we are even assailed to our face with reproaches and insults, when everything is done to stir up our fury and to move our spirit to wrath? Then it behooves us to remember these things, then let us recall that it is written: "I became like a man who does not hear, and who has no rebuke in his mouth". At times someone speaks against me, and perhaps he lies; at times too the things he says are true; I, however, can say much worse of him, and truly say it: And if indeed I am a sinner, and remember none of these things which we have now said, I shall imitate his malice, and by returning curses for curses I shall become like him, but I do not become like God. But if I am righteous, like one deaf I do not hear, and like one dumb having no rebuke in his mouth, I answer nothing, and though I have grounds on which to reprove him, I do not reprove. For I understand that he who reproves rightly ought to reprove without passion, so that he may seek the salvation of the one who is reproved, not vengeance. When, therefore, anyone disparages me, or speaks evil of me, if I reprove him, I do not act fittingly. For out of wrath and indignation I reprove him, wishing to inflict upon him sadness — not that sadness which is according to God, which works repentance unto stable salvation, but the sadness which wounds the soul, does not amend it. If, therefore, we remember these things, we will indeed not do them, but when something of the sort befalls us, we say that "I became like a man who does not hear, and who has no refutations in his mouth". But why have I become such? "Because", he says, "I have hoped in You". For unless I had hoped in You, and had believed Him who says: "Vengeance is Mine, I will repay, says the Lord", I would assuredly have avenged myself: but now I am mindful of that precept by which we are commanded not to avenge ourselves, but to give place to wrath. And you will find these things in the divine Scriptures, and read them. "And I became like a man who does not hear, and who has no rebukes in his mouth. For in You, O Lord, have I hoped; You will hear me, O Lord my God". I, like one deaf, did not hear those who charged me, but do You hear the things which they speak. If we were such as the divine word wishes us to be, like Elijah, we would assuredly say to God that He should give rain, and it would rain: like Samuel in the days of the harvests we would ask that He furnish from heaven an abundance of showers, and we would be heard. But how will God hear us, when we ourselves do not hear? How will He do what we wish, when we do not do the things which He wishes? God wishes us to be such that we may speak with God as though gods. He wishes us to be sons of God, that we may become fellows and coheirs, sons of God, and may say as He Himself said: "Father, I know that You always hear me". We know that God said to us: "I have said: You are gods, and all of you sons of the Most High". But we, according to our merits, rather await that of which we are worthy, and what follows: "But you shall die like men, and shall fall like one of the princes".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily07.html'
source_title="HOMILIES ON PSALMS 38, HOMILY II"
