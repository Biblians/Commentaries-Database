[[commentary]]
quote='''
There is, then, a certain childish age according to the inner man, and there is also a youthful age, and there is an aged age, according to what the Apostle said: "When I was a little one, I spoke as a little one, I was wise as a little one, I thought as a little one; but when I became a man, I did away with the things that were of a little one". I understand these things to be said by the Apostle not of bodily age, but because, when in the beginning he had believed, he was a little one lately born, desiring the reasonable and guileless milk; then he understood the Scriptures as a little one, was wise concerning the Gospel as a little one, thought as a little one; but after this, advancing in age after the likeness of Christ — of whom it is written that "He advanced in age and wisdom and grace with God and with men" — he laid aside the things that were of a little one: and therefore he said, "When I became a man, I laid aside the things that were of a little one".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily04.html'
source_title="HOMILIES ON PSALMS 37, HOMILY IV"
