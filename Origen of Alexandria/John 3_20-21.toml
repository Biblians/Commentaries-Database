[[commentary]]
quote='''
"Everyone who does evil hates the light, and does not come to the light lest his works be reproved. But he who does the truth comes to the light". Since therefore he who does evil hates the light, and, as far as in him lies, hiding the evils which he does, and fearing lest he be reproved, veils and covers his way, and covers his acts as with a certain veil. For example's sake, if any of you — though I would not wish there to be any such person in this assembly — yet if anyone among you, whether a catechumen, or even some one of the many faithful, is conscious to himself that he has fornicated, and conceals the offense, does not this one seem to you to hide, and to cover the way on which he walks? But he who acts chastely, and is confident of the purity of his life, does not wish to cover over his way, but wishes it to be manifest — manifest, I say, not to men, lest perhaps he receive his reward from men, but he makes it manifest to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily01.html'
source_title="HOMILIES ON PSALMS 37, HOMILY I"
