[[commentary]]
quote='''
Therefore on this account we are enlightened by the commandment of the Lord, so that, when the flame of unlawful jealousy has beaten upon our heart and mind, we, taught by the words, may say: If I should wish to be jealous among the malignant, or should envy those who work iniquity, see what follows: "Like grass", he says, "they shall quickly wither, and like the green herbs they shall quickly fall away". Do you wish also to be fortified by the authority of another prophet's admonitions concerning such men? Hear what Isaiah too pronounces concerning all carnal glory: "All flesh", he says, "is grass, and all its glory as the flower of grass". Do you wish also to see through particular cases how the glory of the flesh is the flower of grass? See who ruled thirty years ago, how his rule flowered: but straightway like the flower of grass it withered; then afterward another after him, then another and another, who thereafter were leaders and princes: and all their glory and honor not only withered like a flower, but even, like dry dust scattered by the wind, left not even a trace of itself. Others too, lifted up by riches and swollen with honors, striving either to be held praiseworthy through feigned goodness, or execrable through untamed cruelty. If anyone thinks their vain pursuits are to be envied, let him now go to the remains of their corpses, if indeed even these can be found; for to some not even this has been granted: and then he will find how "all flesh is grass, and all its glory as the flower of grass. The grass has withered and its flower has fallen away". But whoever does not love the little flowers of the flesh, nor lives carnally, but loves the word of God, and advances in it, hear what he may hope for: "The word", he says, "of the Lord abides forever". But this very thing also which he says, that "like grass they shall quickly wither", namely the malignant — I do not think it is idle why he compared them to grass, when surely there could be other material to which those who have acted maliciously might be compared. Grass is the food of dumb and irrational animals. Perhaps therefore, because all the foolish, and the untaught, and those who live against the reason and wisdom of God, follow those who are chief in malice, and are said to feed on their life and deeds, whom they also obey — for that reason he compared them to grass. For no prudent man takes an example from them. For, just as the prudent man who hears the words of the Lord and does them, this is the one who eats that bread which came down from heaven, and Jesus is food to him, because he is fed from his words and lives in his commandments: so likewise these who are eminent in malice are made as grass to those who submit to them, or who bear an envy of them unto wickedness. And similar things are also to be understood concerning the green herbs, to which are compared those who work iniquity, because they pass away swiftly. Yet we find in the divine Scriptures sometimes also praiseworthy herbs, which by the precept of the Apostle the weak are bidden to eat. But others are those, and contrary to these, of which it is said that the river of Egypt is water descending downward, and watering as a garden of herbs: whereby evidently the Egyptian is not called a tree, nor even named a vine, but herbs which quickly fail. And do you wish to see how quickly the Egyptian falls away? See what is said of them in Exodus. "But the Egyptians hastened," he says, "they unbound their axles, and quickly fled under the water." Like the green herbs, therefore, they shall quickly fall away. Finally, that iniquitous Ahab also, since he was preparing to plant such herbs in the vineyard of Naboth the Jezreelite — on account of which Naboth chose rather to die than to permit that, the Israelite vineyard being cut down, herbs should be planted. He did this therefore as a righteous man, that he might not permit the vineyard of righteousness to be cut down, whose fruit gladdens the heart of man when it is mixed in the mixing-bowl of wisdom, and herbs of iniquity to be planted, quickly growing green, but more quickly withering. I think therefore that in our hearts too, who believe in the Savior, there is some vineyard planted, just as he said: "A vineyard was made for the beloved on a horn, in a fertile place". But it was also said to those to whom the word of God came first, that "I planted you a wholly fruitful vine". There is therefore for us a certain vineyard from which we press out the fruit of knowledge, which gladdens the heart of man, through the gift of wisdom in the winepresses of the Scriptures, when we behold more perfectly and more broadly the divine mysteries of the law. But as we advance in our studies, and stretch from the Israelite eye toward the spiritual eye, there comes Ahab the iniquitous and impious, Ahab the enemy of our vineyard, and against these best pursuits of wisdom he rouses envy, stirs up tumult, contrives deceits and factions through Jezebel, that is, through carnal wisdom, and wishes this vineyard of spiritual understanding to be cut down, and herbs to be planted — that is, that what we read we should understand carnally: for all the grace of the flesh is like herbs, so that there may be fulfilled in us that which the Apostle censures, saying to the Galatians: "Are you so senseless that, having begun with the spirit, you are now made perfect in the flesh?" But that in the holy soul there are vineyards, and fields blessed by the Lord, hear also Isaac saying to his son Jacob: "Behold, the smell of my son is as the smell of a full field, which the Lord has blessed". It is better therefore for us to cultivate a vineyard in our soul, and to dig the winepress of the Scriptures, and to gather the clusters, and to press the wine from the vine of Sorek, and let us say to the Lord, that "How glorious is your inebriating cup!"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily01.html'
source_title="HOMILIES ON PSALMS 37, HOMILY I"
