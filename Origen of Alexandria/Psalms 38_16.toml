[[commentary]]
quote='''
"For I said: Lest my enemies ever insult over me". When I was charged, and did not return like for like to those who charged me, I said these things: "If I have repaid those who requited me with evils", I shall assuredly be forsaken by God, and, forsaken, I must needs fall. And when I have fallen, my enemies will insult over me. But if I do not repay evils for evils, but leave the judgment to God, aided by Him I shall not fall down, but shall stand firmly, and my enemies will not insult over me. I also said this: "While my feet were being moved, they spoke great things against me". As long as I stand undismayed and unmoved, my enemies will not speak great things against me, for they have nothing to say. But as soon as I waver — I will not say, fall — at once they will begin to reproach and to say: Do you see this man? Behold, what has he himself done! And while he teaches these things, he does other things, does things contrary to those which he teaches. These men, therefore, must needs say some such thing: "While my feet are moved they spoke great things over me". But another, better as regards the persons who are brought forward by the prophets, or who compare themselves to one another, says this: "But as for me, my feet were moved a little short of it". That man's feet were moved, but mine were moved a little short of it. But perhaps there may be some other, whose feet were not moved even a little, nor a little short of it — that one, I suppose, who says: "He set my feet upon a rock". That one testifies nothing at all about a moving of his feet, but about their stability. Blessed, therefore, are we if no moving at all is charged in our feet, but they stand upon the rock, that is, upon the Lord Jesus Christ Himself. But if we cannot be so stable, let this second and lower degree at least receive us, that our steps may be moved even but a little short of it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily07.html'
source_title="HOMILIES ON PSALMS 38, HOMILY II"
