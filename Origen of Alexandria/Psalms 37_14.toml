[[commentary]]
quote='''
"The sinners have unsheathed the sword, they have bent their bow, that they may cast down the needy and the poor". Not that in every kind sinners have a bodily sword, but let us see whether perchance, just as there are certain arms of God, among which is said to be the breastplate of righteousness, and the sword of the spirit, and the shield of faith, so also there are arms of the devil, with which the sinful man is clothed. From contraries, therefore, let us understand contraries, and let us set up two armed soldiers, one a soldier of God, the other a soldier of the devil. And if indeed the soldier of God has the breastplate of righteousness, without doubt the soldier of the devil bears the breastplate of unrighteousness contrary to this. And if the soldier of God gleams in the helmet of salvation, on the contrary the sinner who is the soldier of the devil is clothed with the helmet of perdition. And if the feet of the soldier of Christ are ready for the course and preaching of the Gospel, on the contrary the feet of the sinner run swiftly to shed blood, and his sandals, that is his preparation, are fitted for evil. The soldier of God, therefore, has a certain shield of faith, and the soldier of the devil too has the shield of unbelief. So then there is a certain sword of the Holy Spirit in those who war for God; but there is also a sword of the malignant one in those who war for sin, which sword the sinners are now said to unsheathe. But how are the sinners to be thought to unsheathe the sword? While already shamelessly and without any veil of modesty they perpetrate their iniquities, and neither blush nor feel reverence, nor as it were in a sheath do they hide and cover their wickedness, but with a proud and haughty spirit they lay it bare like a certain sword. Likewise also they carry out that which follows, that is, "they have bent their bow". But the righteous too have a bow, they have arrows also. In fact even one arrow of theirs is the Lord Jesus, for he himself says: "And he set me as a chosen arrow". The righteous, therefore, have arrows, and the sinners have them too. The word is an arrow: and the word of the righteous, indeed, when it reproves and corrects the sinner, like an arrow pricks and pierces through his heart, that he may be converted to repentance and be saved. But the word of the sinner is one that has poison and shoots and wounds him who is not fortified with the arms of God. For then the words of the unrighteous prevail against us, when we are less cautiously guarded with the shield of faith. "They have bent, therefore, their bow, that they may cast down the needy and the poor". Sinners know that they cannot cast down the rich man, and therefore neither do they stretch snares for him, but all their snares are directed against the poor man, as it is also said elsewhere, that "he lies in wait like a lion in his den, he lies in wait to seize the poor man". And because "the ransom of a man is his riches", but the poor man is not able to endure threats, therefore we are made rich in spiritual goods, that is, in every word, and in all knowledge, in good works, casting away the riches of sin, looking not on the things which are seen, but on the things which are not seen. For the riches which are seen are temporal; but those which are not seen are eternal. And if we grow rich in such riches, we cannot be wounded by the arrows of the sinners. For they shall be quenched by the shield of faith, through Christ our Lord and Savior, to whom is glory and dominion unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily02.html'
source_title="HOMILIES ON PSALMS 37, HOMILY II"


[[commentary]]
quote='''
In the preceding treatise we said certain things about the sword and bow of sinners, and about the arms of God, and that all men are armed; and where we said all men, I will now add what was lacking in what preceded, that is, all those who are already able to sin, or to abstain from sins. For infants can handle neither the arms of God nor the arms of the devil. But if any are already able, in word and act and thought, to know what is right and to avoid what is contrary, these are they who are said to have all the arms; and if indeed they sin, they have the arms of the devil and of iniquity; but if they act rightly, they will be said to be clothed with the arms of God. What then he said, "The sinners have drawn the sword, they have bent their bow", we explained, following the Apostle, who spoke from contraries: "And the sword of the spirit, which is the word of God", that the sword of sinners would be the wicked spirit that is in them, which inspires them to words of blasphemy, and of iniquity, and of foulness. For example, if you see the gentiles fighting against one another in disputes, and constructing against each other diverse impieties by the cunning tricks of the dialectic art, you can then fittingly say that the sinners have drawn the sword. But even I who am called faithful, if perhaps I have a quarrel with someone, and, provoked to anger, cast aside meekness and utter furious words, and dismiss the spirit with lies and swollen and venomous speeches, deservedly I too, as a sinner, am said to have drawn the sword. It is therefore good, first, not even to have the sword of sin; but the second best thing is at least not to draw it, but to hide it away in its sheath. For if the sword is not brought forth from the sheath, nor used, its edge is blunted and consumed by rust, and if it always rests from work it will be exterminated. For this the Lord also promises, that he will exterminate the sword, that is, sin, so that there may no longer be a sinner. But if indeed we anticipate this work by the word of God, and while placed in this life make sin to perish within us, so that never at all is the sword of sin brought forth from us, neither by thought, nor by work, nor by word, we shall not need the punishment of eternal fire, we shall not be condemned to the outer darkness, nor shall we lie under those torments which threaten sinners. But if in this life we despise the words of the divine Scripture that admonishes us, and refuse to be cured or amended by its corrections, it is certain that that fire remains for us which has been prepared for sinners, and we shall come to that fire in which "the fire will prove of what sort each one's work is". And, as I judge, it is necessary for us all to come to that fire. Even if one be a Paul or a Peter, still he comes to that fire. But such men as those hear: "Even if you pass through the fire, the flame will not burn you". But if anyone be a sinner like me, he will indeed come to that fire like Peter and Paul, but he will not pass through as Peter and Paul do. And just as the Hebrews came to the Red Sea, and the Egyptians came too, but the Hebrews indeed crossed the Red Sea, while the Egyptians were drowned in it: in this way we too, if indeed we are Egyptians, and follow Pharaoh the devil, obeying his precepts, shall be drowned in that river or fiery lake, when sins are found in us, which without doubt we chose from the precepts of Pharaoh. But if we are Hebrews, and have been redeemed by the blood of the spotless lamb, if we do not carry with us the leaven of wickedness, we too indeed enter the river of fire. But just as for the Hebrews the water was a wall on the right hand and the left, so too the fire will be a wall, if we do what is said of them, that they believed God and Moses his servant, that is, his law and his commandments, and so follow the pillar of fire and the pillar of cloud. These things we have set forth as an admonition, repeating the explanation of how the sinners have drawn the sword.

But neither should this be passed over idly, that they are also said to have bent their bow: which we resolved now not by the setting-alongside of a contrary, as we did in the other cases, but from things similar. In the tenth psalm it is written that "The sinners have bent the bow, they have prepared arrows in the quiver, to shoot in the dark at the upright of heart". Whence it appears that the heart of the impious is filled, as a quiver, with venomous arrows. There are therefore arrows of the impious: their most wicked counsels and thoughts; but their mouth and lips are a kind of bow, by which, when it is widened and drawn taut, the darts of the venomous heart are hurled. But what he says, "in the dark", is fittingly said. For such men do not walk in the day, that is, in the light of God, but they walk in the darkness, and lurk hidden in the obscurity of malice and of ignorance. And that they shoot at the upright of heart, that is, at the simple and those ignorant of their malice. But I think that this saying is spoken not so much of sinful men as of the contrary powers. For it is they who shoot in the dark at the upright of heart. Therefore let those who are upright of heart keep watch day and night, because those have indeed prepared their arrows. He did not say, they have shot, but "they have prepared arrows"; they did not shoot nor wound, but they prepare themselves to shoot. You see that we are admonished before we are wounded, so that we may defend ourselves from their wounds, and keep our heart with all guard.

I wish also, being placed in these passages, to open up something further, lest I always speak to you of lower things, but that sometimes we may knock at certain higher matters too. I consider, then, that just as the Savior is an arrow of God, as it is written: "He set me as a chosen arrow"; and without doubt, by a similar example, Moses too, in whom God spoke, is an arrow of God: and the other prophets and apostles of Christ, in whom Christ himself was speaking, it is certain that through the arrow of God they wounded and pricked the heart of those to whom they spoke the word of God, so that those who heard the word of God from them said, "I am wounded with charity"; so again, on the contrary, just as Christ is the chosen arrow of God, so also the Antichrist is the arrow of the devil. And just as all in whom Christ spoke, or speaks—according to this likeness the prophets and apostles were themselves also arrows of God, and whoever, being righteous and a preacher, speaks the word of God to accomplish the salvation of men, can be called an arrow of God: so also all sinners, in whom the devil speaks, can be called arrows of the devil. If therefore you should ever see yourself being wounded by the arrows of the devil through the mouth of a sinner, have pity indeed on him who offers himself to the devil as a minister for this work; but you, be mindful of yourself, and seize the shield of faith, that in it you may be able to extinguish all the fiery darts of the malignant one. And not only in words, but in deeds are the darts of the devil aimed at us. For if you were to see a woman lying in wait for you, to deceive you, is not this too a fiery dart of the devil, when she so speaks to you as to stir up in you the fire of lust? Likewise also, if someone provoke you to anger with bitter and harsh words, is not this too a fiery dart of the malignant one, by which you are inflamed and kindled to fury? But also if someone provoke and instigate you to something else, which, bearing it impatiently, you fall into sin, understand more diligently, and observe that all these are fiery darts of the malignant one, by which he inflames the upright of heart, and wounds them unto sin. But what is more unhappy, I see few arrows of God, few are there who so speak as to inflame the heart of the hearer, and draw him away from sin, and turn him to repentance. Few so speak who, having struck the heart of the hearer, draw from his eye a tear of repentance, who, opening the light of future hope and the greatness of the age to come, and testifying to the glory of the kingdom of God, can persuade men to despise the things that are seen, and to seek the things that are not seen, to spurn the things that are temporal, and to seek the things that are eternal. Very few there are such, and these, if there be any, are few: by envy and spite it is so brought about that there be not even a few at all, that they may not be able even to profit anyone. But the arrows of the devil abound in all places, all the earth is filled with them. The peoples of the world, the military hand, are for the greatest part arrows of the malignant one—would that the enemy prevailed only there, and among those, so that he had those alone for arrows. But now I fear even those who are within, and I fear myself, lest perhaps the devil lead me into some scandal, and use me as an arrow against the soul of a man: for whoever gives scandal to anyone, whether in word or in deed, that man has become to the soul which he scandalized an arrow and a dart of the devil. And see what happens to us more unhappily. Sometimes we think to speak against someone, and incautiously bring forth speeches, while we act too contentiously, and are eager to win by whatever words; then the devil uses our mouth as a bow, through which he may aim arrows and shoot at the upright of heart—namely, those who hear us speaking those things in which they suffer scandal. And just as God set the bow in the clouds, that there be no flood, and that the tempest may cease: so on the contrary the devil sets his bow not to make it cease, but to stir up tempests, to disturb the serenity in the soul, to drive away peace, to set wars in motion, and to rouse whirlwinds and storms. For when you see someone agitated by vices and passions going about and disturbing all things, I would not have you doubt that he is an arrow of the devil, and that his mouth has set his bow, and that his words have bent the arrows to shoot at the upright of heart. But those who are fortified with the arms of God could not be wounded by such as these.

But what he added, "that they may slay the upright of heart", since he had said above, "that they may cast down the needy and the poor", he joined to the poor the upright of heart: whom, I think, the Lord likewise joins in the Gospels; for where he says the poor are blessed, there he also blesses the pure of heart, and I judge that there is no difference between the pure of heart and the upright of heart. And they are slain in this way. If anyone come with simple mind and desire to the Church, that he may make progress, that he may become better, this man, if he see us who have already stood in the faith for a long time either not acting rightly or speaking with offense, we become to him an occasion of falling into sin. And when he has sinned, he is slain, and the blood of his soul flows out, all vital power departs from him. And if you hear it said in Genesis that "I will require the blood of your souls from every brother and from every beast", do not think that it commands so greatly about this bodily blood, as about the blood of the inner man, that is, about the life of the soul and the spiritual blood. For the blood of a scandalized soul is poured out when it has fallen into sin, and therefore he said that his blood is required from the brother. And why also from the beast? If he who scandalized you is faithful, he is a brother, from whom your blood is to be required. For he is your brother who shed your blood, and therefore it is said, "From the hand of the brother I will require the blood". But when a contrary power, wild and wicked, presses upon a man, and he is unfaithful through whom it lies in wait, if it has been able to shed the blood of your soul, that is, to cast you down into sin, it is a beast through which the Lord requires your blood. But Ezekiel the prophet too, when he says that he is set as a watchman for the house of Israel, who, if he announce the coming sword, does not become guilty of blood, but if he does not announce it, is guilty of blood; and in the law, when it is said, if he do this and this, he will be innocent of blood; without doubt here too he designates the blood of the soul, which is poured out through sin. Therefore let us all fear, lest perhaps the blood of someone who is scandalized be required from us, as the prophet designates. These things it behooved us to repeat, that we might more fully show how the sinners have drawn the sword and bent their bow, and who was the poor man whom they cast down, and how the upright of heart are slain, or what is the blood of theirs that is poured out.
'''
