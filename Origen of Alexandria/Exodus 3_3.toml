[[commentary]]
quote='''
Moses, when he had seen the bush burning and not consumed, marveling at the sight said: "I will pass over and behold this sight." Certainly he too was not signifying that he would traverse some span of earth, nor climb mountains nor go apart into the steep places of the valleys. The vision was close to him, in his mouth and in his eyes. But he says: "I will pass over," to show that, admonished by the heavenly vision, he ought to ascend to a higher life and to cross over from those things in which he was to better things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily12.html'
source_title="HOMILIES ON GENESIS 12.2"


[[commentary]]
quote='''
Great, then, is the vision, when God is seen with a pure heart. Great is the vision when with a pure heart the Word of God, and the Wisdom of God, who is His Christ, is acknowledged. Great is the vision, to acknowledge and to believe in the Holy Spirit. Great, then, is this vision — the knowledge of the Trinity. Nevertheless, even Moses was then seeing in Exodus the great vision, and he who was seen in the bush in the fire is called an angel, and he calls it a great vision. For he understood who it was in the angel. For immediately thereupon He says to God: "I am the God of Abraham, and the God of Isaac, and the God of Jacob". See, then, how great this vision is — although this very thing also is great, to know that God makes "His angels spirits, and His ministers a burning fire". And now indeed to Moses, still pasturing the flocks of Jethro his father-in-law, and stepping or passing over from these, this vision is great, in which an angel is said to appear to him. But if he shall also have passed over the Red Sea, and the pillar of cloud has covered him, and he has adored the sacraments of the future baptism, then he will be able to see a still greater vision. For he will enter into the darkness and the whirlwind, where God Himself is said to be, where it is written that Moses alone drew near to God, but the others stood afar off. And Moses advances so far through these great visions, that he says to God: "If I have found", he says, "grace before Thee, manifest Thyself to me, that I may evidently see Thee". And then he hears from God: "I will set thee in the cleft of the rock" — and the rock was Christ — that through a very small opening thou mayest see My hinder parts, that is, that thou mayest acknowledge those things which in the last times shall be fulfilled through the assumption of the flesh: "But My face thou shalt not be able to see".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily04.html'
source_title="HOMILIES ON PSALMS 37, HOMILY IV"
