[[commentary]]
quote='''
That this sentence is to be taken of this life, hear Ecclesiastes testifying and saying: "I praised all who have died above all who live, whoever they are that live even until now, and good above these two is he who has not yet been born". He praises therefore the dead more than the living, because those have at least this much of gain, that they are freed from the bonds of this body, and are no longer clothed with flesh and skins, nor inserted into bones and sinews, nor any longer subject to the necessity of the body. If therefore you have understood what it is to live in the flesh, even if one be Moses, or whoever he is, this life is troublesome to him. For she is not released from corruption, who is surrounded by a mortal and earthly body. See therefore that the whole is vanity, every living man; let us despise this vain life, and hasten to the holy and blessed and true life, and let us tend toward it with soul and mind, all vanity being shaken off.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily08.html'
source_title="HOMILIES ON PSALMS 39, HOMILY I"
