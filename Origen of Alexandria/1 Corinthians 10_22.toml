[[commentary]]
quote='''
In the Apostle also it is written: "Do we provoke the Lord to jealousy? Are we stronger than he?" And where we have "we provoke the Lord to jealousy", in certain copies it is written "we provoke the Lord". In that passage he said these things where he disputes about sacrifices and about the things offered to idols. "Do we provoke the Lord to jealousy", he says, that is, do we rouse him to zeal by eating the things offered to idols, just as the Jews stirred his zeal in their idols? Do we too wish to act in a like manner? Therefore he says: "Do we provoke the Lord to jealousy? Are we stronger than he?" This is what he means. If indeed we rouse to jealousy someone who is inferior to us in strength, we can easily despise him; but if we rouse a strong one to jealousy, are we not contriving these things unto our own ruin? If therefore we feed on things offered to idols, and rouse the Lord's zeal against us, we provoke a stronger wrath against us, that is, unto our own destruction.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily01.html'
source_title="HOMILIES ON PSALMS 37, HOMILY I"
