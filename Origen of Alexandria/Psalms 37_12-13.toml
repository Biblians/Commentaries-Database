[[commentary]]
quote='''
"The sinner shall watch the righteous, and shall gnash upon him with his teeth". For just as by nature light and darkness are contrary, so contrary to one another are the sinner and the righteous. And if you see the righteous man at any time held in hatred, do not hesitate to say of him who hates the righteous, that he is a sinner. If you see him who lives well suffering persecution, do not hesitate to say of him who persecutes, that he is not only a sinner, but wicked. The sinner, therefore, shall watch the righteous, and watching him shall gnash upon him with his teeth. As for what he says, "he shall gnash with his teeth", I know not whether it is to be taken of bodily teeth, although it be possible that this too be done by the sinner against the righteous. When he threatens him, when he rages against him, when he is silent in voice, and cries out in fury, when he contrives snares for the righteous, and devises every evil against him, then also is fulfilled bodily what is said: "He shall gnash upon him with his teeth". But when the sinner does these things against the righteous, "The Lord", he says, "shall laugh him to scorn, for he foresees that his day shall come". What day does the Lord foresee of the sinner? That one without doubt, when the sinner is sought, and shall not be.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily02.html'
source_title="HOMILIES ON PSALMS 37, HOMILY II"
