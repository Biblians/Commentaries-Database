[[commentary]]
quote='''
"I have been afflicted and humbled exceedingly." On the festivals of the Lord we are commanded to eat the bread of affliction, and on those very festivals it is said that a man is to humble his soul; and when the festival of propitiation is proclaimed, it is said: "Humble your souls." Since, therefore, he who repents for his offenses afflicts and humbles himself, just as that publican too of whom we spoke above, for this reason he consequently says, in that he recognizes that he repents from the heart, beseeching that he be not reproved in the Lord's wrath, nor corrected in his anger, from this which he says: "I have been afflicted and humbled exceedingly." For not only have I been afflicted, nor only have I been humbled, he says, but I have been exceedingly afflicted, and I have been exceedingly humbled. As, for example, I might say: if some man rich according to the world, set in great abundance, should here suddenly fall and be reduced to the utmost destitution, driven also from house and homeland, banished to islands and crags, and should drag out a squalid and unhappy life in solitude, and then thereupon, remembering his homeland and parents, his nobility, his family, the substance of his goods, the abundance of his riches, and that whole life which he had lived in delights — with what lamentations, with what bellowings will he recall the remembrance of his former blessedness, so that it is a greater punishment for him to remember what he has lost than to suffer what he now endures? After the likeness of this example, look for me also at the man who has passed his life in sobriety and chastity and righteousness, who was well conscious to himself in his deeds: if this man should fall from his homeland — that is, from the Church — and be driven to a certain island and to bristling crags, which is the seat of sin, and be rolled down from his faculties and riches which were his in all his good works, and should see himself set in the utmost poverty — for all his acts of righteousness which he did shall not be remembered because of his sin — if, then, he should see himself in such circumstances, with what groanings, and with what roarings will he cry out, saying: "I roared from the groaning of my heart. O Lord, all my desire is before you, and my groaning is not hidden from you." All things, then, from the time I offended, whether I coveted worldly concupiscence, or committed something else, all I bring forth before you, and in my prayers I set them in your sight. "And my groaning is not hidden from you." For you know that I always groan. "My heart is troubled, and my strength has forsaken me." Do you see, O Lord, my heart, for it is troubled because of my sins. And consequently I entreat that I be not reproved in wrath, nor corrected in anger. But if my strength has forsaken me, without doubt I was once strong, and my manner of life was good, but afterward I fell, since "my strength has forsaken me, and the light of my eyes is not with me." This seems to be the voice of one who, after illumination, after the handing down of doctrine, after the recognition of the truth, has fallen into darkness. Let us, then, not suffer the same things, but rather, that our light may always be in us, and that, doing the works of light, we may have confidence as sons of light in Christ Jesus, let us always pray, and let us unceasingly beseech God the Father, to whom be glory and power unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily06.html'
source_title="HOMILIES ON PSALMS 38, HOMILY I"
