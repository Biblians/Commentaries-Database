[[commentary]]
quote='''
"And they shall not be confounded in the evil time". But the righteous shall not be confounded in the evil time. And the evil time here he names the time of judgment, because of the multitude of sinners, and of those whom savage torments shall receive. Then therefore, in the time of resurrection, when all have risen, and some shall rise into eternal life, others into eternal confusion, then, he says, the righteous shall not be confounded, because nothing worthy of confusion is found in their acts. But he adds: "And in the days of famine they shall be satisfied". First it must be inquired who are the days of famine. God threatens in a certain place through the prophet, and says: "Behold, the days come, says the Lord, and I will send a famine upon the earth, not a famine of bread, nor a thirst of water, but a famine for hearing the word of God. And they shall go about from the east even to the west, that they may hear the word of the Lord, and shall not find it". These, therefore, are the days, and this is the time of famine, when there are none who speak the word of God, as also there is now a famine among the Jews. For nowhere is there a prophet, nowhere a wise man, nowhere a prudent judge, nowhere a captain of fifty, nowhere a wise counsellor, nowhere an understanding hearer: God has taken away all things from Judea and Jerusalem. But in us too there is a huge fear, lest perhaps a famine threaten us as well. For just as those of whom we spoke above, by reading the law and not doing it, ran into this: that they suffered a famine of the word of God, and all the gifts of God which we mentioned above were taken away from them, and it was commanded to the clouds (namely the prophets) not to rain upon them the rain of the word of God, it is to be feared lest some such kind of correction be brought upon us too: but let us rather become not only hearers of the law, but also doers, so that the Lord may command his clouds, not one, nor two, but many, to rain upon us the rain, so that in the Church two or three prophets may speak, and the rest examine: and if it be revealed to one sitting, let the first be silent, so that there may be many workmen who need not be confounded, rightly handling the word of truth, so that each of the teachers and of those who preach the word of God may say, according to Paul: "I planted, and he watered, but God gave the increase". And these things will come to pass, if we who are watered by the clouds and have heard the word of God bring forth those fruits which the Apostle enumerates, that is, "the fruits of the spirit", which are "joy, charity, peace, patience, long-suffering", and other things like to these. And if we delay to bring forth these fruits, it is to be feared lest it be commanded to the clouds to withhold their showers from us, and each of the saints begin to do that which is written: "But he who understands shall in that time sit and be silent, because the time is evil". But we ought to remember the history of the ancients concerning the time of famine, how the righteous man is satisfied in the time of famine. A fitting famine, I think, there was in the times of Elijah the prophet, when heaven was shut for three years and six months. And then the people indeed were imperiled by famine, but Elijah did not suffer famine. And then indeed he was fed by an angel, when he also went in the strength of that food, and remained forty days and forty nights; but now he was fed by the ministering ravens, when they brought him bread in the morning and flesh in the evening, and again it is related that he drank water from the torrent Cherith, and came into Zarephath of the Sidonians to a widow woman in the time of famine, and, because he was righteous, he did not suffer the want of famine, but everywhere abundance was at hand for him; and at one and the same time there was famine for sinners; but Elijah, because he was righteous, knew no famine. So therefore, even if a famine come at some time—which the Lord may not grant to his Church!—yet if ever it happen, he who has understanding and exercise in the meditation of the word of God, and has resolved to meditate in his law day and night, and to exercise himself to grasp the spiritual understanding, will find in them that bread which came down from heaven, and the word of God will become to him abundant food, and overflowing drink; and not only food and drink, but if he be able to examine the deeper sacraments of mystical understanding, the words of God will be delights to him. It is possible also in another way in this place for a deeper sense to be opened. The Lord and Savior says: "The night will come when no one can work". And this he says of that time which will be after this age, the time in which each one shall receive punishments for his own evils. Then, therefore, he says that night will come, when now no one can work anything, but each one is then fed from his own works which, placed here, he wrought. When therefore it is night, no one works in that time: when sinners shall be afflicted with punishments, there will without doubt be famine for those who have gathered no fruits of good work. But in that time of famine, the righteous shall be satisfied, namely from the fruits of their own righteousness. For just as in the desert they gathered manna for six days, but on the sixth day they gathered not the measure of one day, but as much as would suffice for the morrow, and each one ate on the Sabbath day what he had gathered on the sixth day; so also now the coming of our Lord Jesus Christ is to be reckoned as a kind of sixth day, and this time of his dispensation, which by his passion he procured in this age. And therefore, while we are in the sixth day, let us gather manna doubly, that it may be able to suffice us when the true observance of the Sabbath of the people of God shall have come. For if we do not gather double food, which may suffice us both in the present age and in the future, in the days of famine we shall not be satisfied. For thus, when the righteous shall be satisfied in the days of famine, "the sinners", it says, "shall perish; but the enemies of the Lord, as soon as they have been honored and exalted, failing shall fail like smoke". The divine word teaches us of what sort are the honors of this age. For when you see that man puffed up, having received the fasces of that province, another lifted up with consulships, another raised up with diverse magistracies, when therefore you see all this elation, consider that, failing, they shall fail like smoke: recall too how many you have seen in these honors, and how great the heights to which you remember them to have ascended even up to your own time, and see whether not all of them, well and truly, after they were exalted, thrown down again and prostrated, failed like smoke. "But the enemies of the Lord, as soon as they shall be honored and exalted, failing shall fail like smoke". But on the contrary the friends of the Lord, as soon as they have been despised and looked down upon and humbled by men, shall be exalted and raised up by God: since "everyone who exalts himself shall be humbled, and he who humbles himself shall be exalted".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily03.html'
source_title="HOMILIES ON PSALMS 37, HOMILY III"
