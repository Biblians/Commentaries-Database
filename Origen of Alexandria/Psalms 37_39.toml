[[commentary]]
quote='''
"But the salvation of the righteous is from the Lord". But better does it say in the Greek: "But the salvation of the righteous is with the Lord". He did not say, in heaven is the salvation of the righteous, for this too passes away; not with any creature, because nothing is immovable or unchangeable: but with the Lord is the salvation of the righteous, who always remains, is always the same, is always immovable, nor anywhere can the salvation of man be more securely than with the Lord. Let that be for me the place, that for me the house, that for me the dwelling, that the rest, that the habitation. In fine, there is announced to us by holy Scripture not only the kingdom of heaven, but the kingdom of God. As I remember myself to have often said already, the kingdom of heaven is of those who are still in their advances; but the kingdom of God, of those who have already come to the perfect end. Whence now also the salvation of the righteous is said to be with God, when, at any rate, by the perfection of life he shall have deserved to arrive even unto the Lord himself. "And he is a protector in the time of tribulation". What is the time of tribulation, except this in which we are, when we walk through the strait and narrow way that leads to life? If indeed we walk through the narrow way that leads to life, and not through that broad and spacious one which is widened by riches and dissolved by luxury, which grows soft in the pleasures of the flesh, which loves present glory. Of these the protector is not God, but Mammon: but of those who are in tribulation and straits, God is the protector, because many are the tribulations of the righteous. For they are troubled, considering the time of judgment and examining themselves, lest perchance something be found in them that may be called to fault.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily05.html'
source_title="HOMILIES ON PSALMS 37, HOMILY V"
